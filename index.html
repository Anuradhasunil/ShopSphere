<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova - Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #081b38;
      color: white;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .search-container input {
      width: 300px;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      padding-left: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }

    .hero-banner {
      background: linear-gradient(rgba(8, 27, 56, 0.6), rgba(8, 27, 56, 0.6)), url('https://unsplash.com') no-repeat center center/cover;
      height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    .hero-banner h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .explore-btn {
      background: #ff9800;
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
      transition: background 0.2s;
    }

    .explore-btn:hover {
      background: #e68a00;
    }

    .section-title {
      text-align: center;
      margin: 40px 0 20px 0;
      color: #081b38;
      font-size: 2rem;
    }

    .products-container {
      max-width: 1200px;
      margin: 0 auto 50px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 0 20px;
    }

    .product-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-card h3 {
      font-size: 1.1rem;
      margin: 15px 0 8px 0;
      color: #333;
    }

    .price {
      font-weight: bold;
      color: #081b38;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .cart-btn {
      background: #081b38;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: #112d59;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">ShopNova</div>
    <div class="search-container">
      <input type="text" placeholder="Search products, brands and more..." onkeydown="searchProduct(event)">
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="payment.html">Cart 🛒</a>
    </nav>
  </header>

  <div class="hero-banner">
    <h1>Welcome to ShopNova</h1>
    <p>Premium shopping experience for fashion, gadgets and lifestyle products</p>
    <a href="products.html" class="explore-btn">Explore Products</a>
  </div>

  <h2 class="section-title">Featured Products</h2>

  <div class="products-container">
    <!-- 1. Shirt -->
    <div class="product-card">
      <img src="https://unsplash.com" alt="Premium Casual Shirt">
      <h3>Premium Casual Shirt</h3>
      <div class="price">₹799</div>
      <button class="cart-btn" onclick="addToCart('Premium Casual Shirt', 799)">Add to Cart 🛒</button>
    </div>

    <!-- 2. Shoes -->
    <div class="product-card">
      <img src="https://unsplash.com" alt="Sports Running Shoes">
      <h3>Sports Running Shoes</h3>
      <div class="price">₹1,499</div>
      <button class="cart-btn" onclick="addToCart('Sports Running Shoes', 1499)">Add to Cart 🛒</button>
    </div>

    <!-- 3. Smart Watch -->
    <div class="product-card">
      <img src="https://unsplash.com" alt="Smart Watch Pro">
      <h3>Smart Watch Pro</h3>
      <div class="price">₹2,999</div>
      <button class="cart-btn" onclick="addToCart('Smart Watch Pro', 2999)">Add to Cart 🛒</button>
    </div>

    <!-- 4. Holy Bible (ADDED HERE FOR HOME) -->
    <div class="product-card">
      <img src="https://unsplash.com" alt="Holy Bible">
      <h3>Holy Bible (Hardcover)</h3>
      <div class="price">₹1,200</div>
      <button class="cart-btn" onclick="addToCart('Holy Bible (Hardcover Edition)', 1200)">Add to Cart 🛒</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
