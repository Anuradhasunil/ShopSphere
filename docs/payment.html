
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova Payment</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f3f4f6;
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .payment-box{
      background:white;
      width:100%;
      max-width:450px;
      padding:35px;
      border-radius:18px;
      text-align:center;
      box-shadow:0 8px 25px rgba(0,0,0,0.15);
    }

    h2{
      color:#081b38;
      margin-bottom:20px;
    }

    .qr{
      width:250px;
      height:250px;
      margin:20px auto;
      display:block;
      border-radius:12px;
    }

    .upi{
      background:#f8fafc;
      padding:12px;
      border-radius:10px;
      margin:15px 0;
      font-weight:bold;
      color:#081b38;
    }

    button{
      width:100%;
      padding:14px;
      background:#059669;
      color:white;
      border:none;
      border-radius:10px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#047857;
    }

    .back{
      display:block;
      margin-top:15px;
      text-decoration:none;
      color:#081b38;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="payment-box">

    <h2>💳 UPI Payment</h2>

    <p>Scan the QR code to complete your payment.</p>

    <img class="qr"
         src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=anuradha@upi&pn=ShopNova&am=999&cu=INR"
         alt="UPI QR Code">

    <div class="upi">
      UPI ID: anuradha@upi
    </div>

    <button onclick="completePayment()">
      Payment Completed ✅
    </button>

    <a href="/cart.html" class="back">
      ← Back to Cart
    </a>

  </div>

  <script>

    function completePayment(){

      localStorage.removeItem('shopnova_cart');

      alert('🎉 Payment Successful! Order Placed Successfully.');

      window.location.href = '/';
    }

  </script>

</body>
</html>
