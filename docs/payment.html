
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNova Payment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#eef4ff;
}

.container{
    max-width:700px;
    margin:50px auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#0f172a;
}

.total{
    font-size:32px;
    color:#2563eb;
    font-weight:bold;
    text-align:center;
    margin-bottom:30px;
}

.payment-option{
    border:1px solid #dbeafe;
    border-radius:14px;
    padding:18px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    transition:0.3s;
}

.payment-option:hover{
    background:#eff6ff;
    border-color:#2563eb;
}

.pay-btn{
    width:100%;
    padding:16px;
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.pay-btn:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="container">

    <h1>💳 Payment Methods</h1>

    <div class="total" id="totalAmount">Total: ₹0</div>

    <div class="payment-option">
        <span>💳 Visa Card</span>
        <input type="radio" name="payment">
    </div>

    <div class="payment-option">
        <span>💳 MasterCard</span>
        <input type="radio" name="payment">
    </div>

    <div class="payment-option">
        <span>📱 UPI Payment</span>
        <input type="radio" name="payment">
    </div>

    <div class="payment-option">
        <span>📲 PhonePe</span>
        <input type="radio" name="payment">
    </div>

    <div class="payment-option">
        <span>💰 Paytm</span>
        <input type="radio" name="payment">
    </div>

    <div class="payment-option">
        <span>🏦 Net Banking</span>
        <input type="radio" name="payment">
    </div>

    <button class="pay-btn" onclick="payNow()">
        Proceed To Payment
    </button>

</div>

<script>

let cart =
    JSON.parse(localStorage.getItem('shopnova_cart')) || [];

let total = 0;

cart.forEach(item => {
    total += Number(item.price);
});

document.getElementById('totalAmount')
    .innerText = 'Total: ₹' + total;

function payNow(){

    alert('🎉 Payment Successful! Thank you for shopping with ShopNova.');

    localStorage.removeItem('shopnova_cart');

    window.location.href = 'index.html';
}

</script>

</body>
</html>
