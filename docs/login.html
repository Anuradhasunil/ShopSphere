
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova Login</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#081b38;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .login-box{
      background:white;
      width:90%;
      max-width:400px;
      padding:40px 30px;
      border-radius:18px;
      box-shadow:0 8px 25px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      color:#081b38;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:18px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:14px;
      background:#ff9800;
      color:white;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#e68900;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:20px;
      text-decoration:none;
      color:#081b38;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h2>🔐 ShopNova Login</h2>

    <input type="email"
           placeholder="Enter your email">

    <input type="password"
           placeholder="Enter your password">

    <button onclick="login()">Login</button>

    <a href="/" class="back">← Back to Home</a>

  </div>

  <script>
    function login(){

      alert('🎉 Login Successful!');

      window.location.href = '/';
    }
  </script>

</body>
</html>
