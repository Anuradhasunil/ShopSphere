
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova Login</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#081b38;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:white;
      padding:40px;
      border-radius:15px;
      width:320px;
    }

    h2{
      text-align:center;
      color:#081b38;
    }

    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      background:#ff9800;
      color:white;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>ShopNova Login</h2>

  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">

  <button onclick="alert('Login Successful 🎉')">
    Login
  </button>
</div>

</body>
</html>
