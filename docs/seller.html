<script>
    // FORCED LOCALBACKEND ROUTER: Hits your local machine server directly from the web
    const backendBaseUrl = 'http://localhost:5000';
    const API_URL = `${backendBaseUrl}/api/products`;
    
    const form = document.getElementById('productForm');
    const statusBox = document.getElementById('statusBox');
    const getLocBtn = document.getElementById('getLocBtn');

    // Handle Geolocation Collection
    getLocBtn.addEventListener('click', () => {
        if (!navigator.geolocation) {
            alert('Geolocation is not supported by your browser');
            return;
        }
        getLocBtn.textContent = '🔄 Detecting Location...';
        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById('lat').value = position.coords.latitude.toFixed(6);
                document.getElementById('lng').value = position.coords.longitude.toFixed(6);
                getLocBtn.textContent = '✅ Location Detected!';
                getLocBtn.style.background = '#dcfce7';
            },
            () => {
                alert('Unable to fetch your location coordinates.');
                getLocBtn.textContent = '❌ Detection Failed';
            }
        );
    });

    // Form submission processing
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        statusBox.style.display = 'none';
        statusBox.className = 'status-msg';
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing upload package...';

        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('price', document.getElementById('price').value);
        formData.append('stock', document.getElementById('stock').value);
        formData.append('category', document.getElementById('category').value);
        formData.append('description', document.getElementById('description').value);

        const fileInput = document.getElementById('images');
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('images', fileInput.files[i]);
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Server error occurred processing cataloging request.');
            }

            statusBox.style.display = 'block';
            statusBox.classList.add('status-success');
            statusBox.innerText = `Success: ${data.message}`;
            form.reset();
            getLocBtn.textContent = '📍 Auto-Detect Location';
            getLocBtn.style.background = '#e2e8f0';

        } catch (error) {
            statusBox.style.display = 'block';
            statusBox.classList.add('status-error');
            statusBox.innerText = `❌ Error: ${error.message}`;
            console.error('Submission transaction fault logs:', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 Add Product to ShopNova';
        }
    });
</script>
