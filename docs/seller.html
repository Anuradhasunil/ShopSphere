<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNova | Seller Panel</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef7ff, #ffffff);
    color: #172033;
    min-height: 100vh;
}

/* ==============================
   HEADER
============================== */
.seller-header {
    background: linear-gradient(135deg, #071a3d, #0b2d63, #164b8f);
    color: white;
    padding: 17px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    box-shadow: 0 5px 20px rgba(7, 26, 61, 0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.seller-brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.seller-brand img {
    width: 145px;
    max-width: 42vw;
    height: auto;
    background: white;
    padding: 5px;
    border-radius: 8px;
    object-fit: contain;
}

.seller-title h1 {
    font-size: 23px;
    margin-bottom: 4px;
}

.seller-title p {
    font-size: 13px;
    opacity: 0.9;
}

.home-btn {
    text-decoration: none;
    color: #08265a;
    background: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    transition: 0.2s;
}

.home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* ==============================
   CONTAINER
============================== */
.seller-container {
    width: min(1200px, 92%);
    margin: 35px auto 60px;
}

.welcome-card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 25px;
    border: 1px solid #dcecff;
    box-shadow: 0 8px 30px rgba(20, 70, 120, 0.08);
}

.welcome-card h2 {
    color: #0b3c82;
    margin-bottom: 8px;
}

.welcome-card p {
    color: #64748b;
    line-height: 1.6;
}

/* ==============================
   GRID
============================== */
.seller-grid {
    display: grid;
    grid-template-columns: minmax(300px, 0.9fr) minmax(400px, 1.1fr);
    gap: 25px;
}

@media (max-width: 850px) {
    .seller-grid {
        grid-template-columns: 1fr;
    }
}

/* ==============================
   CARD
============================== */
.seller-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    border: 1px solid #dcecff;
    box-shadow: 0 8px 30px rgba(20, 70, 120, 0.08);
}

.seller-card h3 {
    color: #0b3c82;
    font-size: 21px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid #e4f0ff;
}

/* ==============================
   FORM
============================== */
.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
    color: #24324a;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #cbd9e8;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    background: white;
    transition: 0.2s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #2878c8;
    box-shadow: 0 0 0 3px rgba(40,120,200,0.10);
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

/* ==============================
   MULTIPLE IMAGE UPLOAD
============================== */
.image-help {
    margin-top: 7px;
    color: #64748b;
    font-size: 12px;
    line-height: 1.5;
}

.image-preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
    gap: 10px;
    margin-top: 13px;
}

.preview-box {
    position: relative;
    height: 110px;
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid #cbdced;
    background: #f4f9ff;
}

.preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.preview-number {
    position: absolute;
    top: 5px;
    left: 5px;
    background: #082b63;
    color: white;
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
}

/* ==============================
   LOCATION
============================== */
.location-row {
    display: flex;
    gap: 10px;
}

.location-row input {
    flex: 1;
}

.location-btn {
    border: none;
    background: linear-gradient(135deg, #082b63, #1764aa);
    color: white;
    padding: 0 16px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
}

.location-btn:hover {
    transform: translateY(-1px);
}

.coordinates {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.coordinates input {
    background: #f5f9fd;
    color: #64748b;
}

/* ==============================
   ADD BUTTON
============================== */
.add-product-btn {
    width: 100%;
    border: none;
    background: linear-gradient(135deg, #082b63, #1764aa, #2388d4);
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
}

.add-product-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(8,43,99,0.25);
}

/* ==============================
   MESSAGE BANNER
============================== */
.message {
    display: none;
    margin-top: 15px;
    padding: 13px 15px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: bold;
}

.message.success { display: block; background: #eaf8f0; color: #176b3a; border: 1px solid #bce7ca; }
.message.error { display: block; background: #fff1f1; color: #a32121; border: 1px solid #efc0c0; }
.message.info { display: block; background: #eef6ff; color: #145a96; border: 1px solid #c8e1fa; }

/* ==============================
   PRODUCTS CATALOG MANAGEMENT
============================== */
.products-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.products-header h3 {
    margin: 0;
    border: none;
    padding: 0;
}

.refresh-btn {
    border: 1px solid #1764aa;
    background: white;
    color: #0b4d8b;
    padding: 9px 15px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.refresh-btn:hover {
    background: #edf7ff;
}

.product-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 17px;
}

.product-item {
    border: 1px solid #dce6f0;
    border-radius: 13px;
    overflow: hidden;
    background: white;
    box-shadow: 0 5px 18px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
}

.product-image {
    width: 100%;
    height: 175px;
    background: #f3f8fd;
    overflow: hidden;
    position: relative;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 14px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.product-info h4 {
    color: #1d2b3f;
    margin-bottom: 7px;
    font-size: 16px;
}

.product-category {
    display: inline-block;
    background: #e8f3ff;
    color: #07599c;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 8px;
    align-self: flex-start;
}

.product-price {
    font-size: 17px;
    font-weight: 800;
    color: #0b4d8b;
    margin-bottom: 10px;
}

.product-description {
    font-size: 12px;
    color: #718096;
    line-height: 1.5;
    margin-bottom: 12px;
    flex-grow: 1;
}

.delete-btn {
    width: 100%;
    background: #fff1f1;
    color: #b91c1c;
    border: 1px solid #fca5a5;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.delete-btn:hover {
    background: #fee2e2;
    color: #991b1b;
}
</style>
</head>
<body>

    <!-- Header Block -->
    <header class="seller-header">
        <div class="seller-brand">
            <img src="images/shopnova-blog-logo.jpg" alt="ShopNova Logo" onerror="this.src='images/shopnova-blog-logo-jpg'">
            <div class="seller-title">
                <h1>Seller Panel</h1>
                <p>Manage your ShopNova products</p>
            </div>
        </div>
        <a href="products.html" class="home-btn">← Back to ShopNova</a>
    </header>

    <div class="seller-container">
        <!-- Dashboard Card -->
        <div class="welcome-card">
            <h2>Welcome, Seller 👋</h2>
            <p>Add your products to ShopNova with clear images, accurate information, and your business location. ShopNova is committed to a safe, friendly and environmentally responsible shopping experience.</p>
        </div>

        <div class="seller-grid">
            <!-- Upload Management Panel -->
            <div class="seller-card">
                <h3>Add New Product</h3>
                <form id="productForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="pName">Product Name *</label>
                        <input type="text" id="pName" name="name" placeholder="Enter product name" required>
                    </div>

                    <div class="form-group">
                        <label for="pPrice">Price (₹) *</label>
                        <input type="number" id="pPrice" name="price" placeholder="Enter price" required>
                    </div>

                    <div class="form-group">
                        <label for="pCategory">Category *</label>
                        <select id="pCategory" name="category" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="Electronics">Electronics</option>
