<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNova | Seller Panel</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eaf4ff, #d8ebff, #f5f9ff);
        color: #183b68;
        padding-bottom: 60px;
    }

    .seller-header {
        width: 100%;
        background: linear-gradient(90deg, #082b5f, #0d4f91, #155da8);
        color: white;
        box-shadow: 0 5px 20px rgba(0,35,90,.22);
    }

    .header-inner {
        width: 95%;
        max-width: 1200px;
        min-height: 75px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .brand-text {
        font-size: 22px;
        font-weight: 900;
    }

    .back-home {
        padding: 10px 17px;
        border-radius: 9px;
        background: rgba(255,255,255,.14);
        color: white;
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
        transition: .2s ease;
    }

    .back-home:hover {
        background: rgba(255,255,255,.25);
        transform: translateY(-1px);
    }

    .page {
        width: 95%;
        max-width: 1100px;
        margin: 35px auto 50px;
    }

    .page-title {
        text-align: center;
        margin-bottom: 28px;
    }

    .page-title h1 {
        color: #082b5f;
        font-size: clamp(30px,5vw,48px);
        font-weight: 950;
    }

    .seller-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 12px 40px rgba(20,65,110,.12);
        border: 1px solid #dce9f7;
    }

    .section-title {
        color: #0b3d78;
        font-size: 20px;
        font-weight: 900;
        margin-top: 25px;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e4edf7;
    }

    .section-title:first-of-type {
        margin-top: 0;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        margin-bottom: 7px;
        color: #244b73;
        font-size: 13px;
        font-weight: 800;
    }

    input, textarea, select {
        width: 100%;
        border: 1px solid #cbdced;
        border-radius: 10px;
        padding: 12px 14px;
        outline: none;
        background: #fbfdff;
        color: #183b68;
        font-size: 14px;
        font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
        border-color: #3280e8;
        box-shadow: 0 0 0 3px rgba(50,128,232,.12);
        background: white;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    /* IMAGE UPLOADER STYLES */
    .image-box {
        padding: 18px;
        border: 2px dashed #b9d5ef;
        border-radius: 12px;
        background: #f8fbff;
        margin-bottom: 20px;
    }

    .image-select-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .select-image-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 10px;
        background: linear-gradient(135deg, #1767d8, #0875b9);
        color: white;
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
        border: none;
        transition: .2s ease;
    }

    .select-image-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 18px rgba(23,103,216,.25);
    }

    #productImage {
        display: none;
    }

    .image-count {
        color: #1767d8;
        font-size: 13px;
        font-weight: 900;
    }

    .image-help {
        margin-top: 8px;
        color: #698198;
        font-size: 12px;
    }

    .image-preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 18px;
    }

    .image-preview-card {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid #d9e6f3;
        background: white;
        box-shadow: 0 4px 12px rgba(20,65,110,.08);
    }

    .image-preview-card img {
        display: block;
        width: 100%;
        height: 150px;
        object-fit: contain;
        background: #eef5fc;
    }

    .image-name {
        padding: 9px;
        padding-right: 30px;
        text-align: center;
        overflow: hidden;
        color: #56708e;
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .remove-image {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 25px;
        height: 25px;
        border: none;
        border-radius: 50%;
        background: #c62828;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        z-index: 2;
    }

    .remove-image:hover {
        background: #a51d1d;
    }

    /* GEOLOCATION STYLES */
    .location-btn {
        background-color: #0076df;
        color: white;
        border: none;
        padding: 12px 20px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 15px;
        display: inline-block;
        transition: .2s ease;
    }

    .location-btn:hover {
        background-color: #005fb8;
        transform: translateY(-1px);
    }

    .status-msg {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 15px;
        display: none;
    }

    .status-msg.success { color: #2e7d32; display: block; }
    .status-msg.error { color: #c62828; display: block; }

    /* SUBMIT LAYOUT BUTTON */
    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(180deg, #00798c, #005c6a);
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 25px;
        transition: .2s ease;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,92,106,.22);
    }

    .submit-btn:disabled {
        opacity: .65;
        cursor: wait;
        transform: none;
    }

    .feedback-banner {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
        font-size: 14px;
        margin-top: 15px;
        display: none;
    }

    .feedback-banner.error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .feedback-banner.success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }

    @media (max-width: 700px) {
        .form-grid { grid-template-columns: 1fr; }
        .form-group.full { grid-column: auto; }
        .image-preview-grid { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

    <header class="seller-header">
        <div class="header-inner">
            <div class="brand-text">ShopNova</div>
            <a href="/" class="back-home">Back to Store</a>
        </div>
    </header>

    <main class="page">
        <div class="page-title">
            <h1>Seller Panel</h1>
        </div>

        <div class="seller-card">
            <form id="productForm">
                
                <!-- SECTION 1: METADATA -->
                <div class="section-title">Product Information</div>
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="title">Product Title *</label>
                        <input type="text" id="title" required placeholder="e.g. Wireless Noise Cancelling Headphones">
                    </div>
                    
                    <div class="form-group">
                        <label for="price">Price ($) *</label>
                        <input type="number" id="price" min="0" step="0.01" required placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Quantity *</label>
                        <input type="number" id="stock" min="0" required placeholder="0">
                    </div>

                    <div class="form-group full">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Home & Kitchen">Home & Kitchen</option>
                            <option value="Books">Books</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="description">Product Description</label>
                        <textarea id="description" placeholder="Describe your item..."></textarea>
                    </div>
                </div>

                <!-- SECTION 2: THE IMAGE UPLOADER -->
                <div class="section-title">Product Media</div>
                <div class="image-box">
                    <div class="image-select-row">
                        <label for="productImage" class="select-image-button">Select Images</label>
                        <input type="file" id="productImage" accept="image/*" multiple>
