<script>
    let filesArray = [];

    /*
     * =====================================================
     * SHOPNOVA BACKEND
     * =====================================================
     *
     * LOCAL:
     * http://localhost:5000
     *
     * AFTER RENDER DEPLOYMENT:
     * Replace the RENDER URL below with YOUR actual
     * Render Web Service URL.
     */

    const LOCAL_BACKEND =
        "http://localhost:5000";

    const RENDER_BACKEND =
        "YOUR_RENDER_SERVICE_URL";


    /*
     * Automatically select local or live backend
     */

    const backendBase =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
            ? LOCAL_BACKEND
            : RENDER_BACKEND;


    /*
     * =====================================================
     * IMAGE SELECTION
     * =====================================================
     */

    document
        .getElementById("productImage")
        .addEventListener(
            "change",
            function(e) {

                const selectedFiles =
                    Array.from(e.target.files);

                selectedFiles.forEach(
                    function(file) {

                        if (
                            filesArray.length < 10 &&
                            file.type.startsWith("image/")
                        ) {

                            filesArray.push(file);
                        }

                    }
                );

                renderPreviews();

                /*
                 * Allow selecting the same file again
                 */
                this.value = "";
            }
        );


    /*
     * =====================================================
     * SUBMIT PRODUCT
     * =====================================================
     */

    document
        .getElementById("productForm")
        .addEventListener(
            "submit",
            async function(e) {

                e.preventDefault();


                /*
                 * Check images
                 */

                if (
                    filesArray.length === 0
                ) {

                    alert(
                        "Please upload at least one image file."
                    );

                    return;
                }


                /*
                 * Check live backend URL
                 */

                if (
                    backendBase ===
                    "YOUR_RENDER_SERVICE_URL"
                ) {

                    alert(
                        "⚠️ ShopNova cloud server is not connected yet.\n\n" +
                        "Please enter your actual Render Web Service URL."
                    );

                    return;
                }


                /*
                 * Create FormData
                 */

                const formData =
                    new FormData();


                formData.append(
                    "title",
                    document
                        .getElementById("title")
                        .value
                        .trim()
                );


                formData.append(
                    "price",
                    document
                        .getElementById("price")
                        .value
                );


                formData.append(
                    "stock",
                    document
                        .getElementById("stock")
                        .value
                );


                formData.append(
                    "category",
                    document
                        .getElementById("category")
                        .value
                );


                formData.append(
                    "description",
                    document
                        .getElementById("description")
                        .value
                        .trim()
                );


                /*
                 * GPS
                 *
                 * These are your current values.
                 * We can connect real browser GPS later.
                 */

                formData.append(
                    "latitude",
                    "16.306"
                );


                formData.append(
                    "longitude",
                    "80.436"
                );


                /*
                 * Add all images
                 */

                filesArray.forEach(
                    function(file) {

                        formData.append(
                            "images",
                            file
                        );

                    }
                );


                /*
                 * Full backend endpoint
                 */

                const endpoint =
                    backendBase +
                    "/add-product";


                try {

                    console.log(
                        "ShopNova backend:",
                        endpoint
                    );


                    /*
                     * Send product
                     */

                    const response =
                        await fetch(
                            endpoint,
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    /*
                     * Read response safely
                     */

                    const text =
                        await response.text();


                    let result;

                    try {

                        result =
                            JSON.parse(text);

                    } catch {

                        result = {
                            success: false,
                            message:
                                text ||
                                "Server returned an invalid response."
                        };

                    }


                    /*
                     * Check response
                     */

                    if (
                        response.ok &&
                        result.success !== false
                    ) {

                        alert(
                            "🎉 Catalog updated successfully!\n\n" +
                            "Product received by ShopNova server."
                        );


                        /*
                         * Clear form
                         */

                        document
                            .getElementById("productForm")
                            .reset();


                        filesArray = [];

                        renderPreviews();


                        /*
                         * Go to products page
                         */

                        window.location.href =
                            "products.html";

                    } else {

                        alert(
                            "⚠️ Publish failure:\n\n" +
                            (
                                result.message ||
                                "Unknown server rejection."
                            )
                        );

                    }

                } catch (error) {

                    console.error(
                        "SHOPNOVA NETWORK ERROR:",
                        error
                    );


                    alert(
                        "🚫 Transmission Failed.\n\n" +
                        "ShopNova could not connect to the cloud server.\n\n" +
                        "Backend:\n" +
                        endpoint
                    );

                }

            }
        );


    /*
     * =====================================================
     * IMAGE PREVIEWS
     * =====================================================
     */

    function renderPreviews() {

        const previewGrid =
            document.getElementById(
                "previewGrid"
            );


        const countDisplay =
            document.getElementById(
                "imageCountDisplay"
            );


        if (countDisplay) {

            countDisplay.textContent =
                `${filesArray.length} image(s) selected`;

        }


        if (!previewGrid) {
            return;
        }


        previewGrid.innerHTML = "";


        filesArray.forEach(
            function(file, index) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "preview-card";


                const img =
                    document.createElement(
                        "img"
                    );


                const reader =
                    new FileReader();


                reader.onload =
                    function(e) {

                        img.src =
                            e.target.result;

                    };


                reader.readAsDataURL(
                    file
                );


                /*
                 * Remove button
                 */

                const btn =
                    document.createElement(
                        "button"
                    );


                btn.className =
                    "remove-btn";


                btn.innerHTML =
                    "&times;";


                btn.type =
                    "button";


                btn.onclick =
                    function() {

                        filesArray.splice(
                            index,
                            1
                        );

                        renderPreviews();

                    };


                card.appendChild(
                    img
                );


                card.appendChild(
                    btn
                );


                previewGrid.appendChild(
                    card
                );

            }
        );

    }
</script>
