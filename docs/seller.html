<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNova | Seller Panel</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef7ff, #ffffff);
    color: #172033;
    min-height: 100vh;
}
/* ================= HEADER ================= */
.seller-header {
    background: linear-gradient(135deg, #071a3d, #0b2d63, #164b8f);
    color: white;
    padding: 16px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    box-shadow: 0 5px 20px rgba(7,26,61,.25);
    position: sticky;
    top: 0;
    z-index: 1000;
}
.seller-brand {
    display: flex;
    align-items: center;
    gap: 15px;
}
.seller-brand img {
    width: 145px;
    max-width: 42vw;
    height: 55px;
    background: white;
    padding: 5px;
    border-radius: 8px;
    object-fit: contain;
}
.seller-title h1 {
    font-size: 23px;
    margin-bottom: 4px;
}
.seller-title p {
    font-size: 13px;
    opacity: .9;
}
.home-btn {
    text-decoration: none;
    color: #08265a;
    background: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}
.home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
}
/* ================= CONTAINER ================= */
.seller-container {
    width: min(1200px, 92%);
    margin: 35px auto 60px;
}
.welcome-card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 25px;
    border: 1px solid #dcecff;
    box-shadow: 0 8px 30px rgba(20,70,120,.08);
}
.welcome-card h2 {
    color: #0b3c82;
    margin-bottom: 8px;
}
.welcome-card p {
    color: #64748b;
    line-height: 1.6;
}
.seller-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}
@media(max-width:900px) {
    .seller-grid {
        grid-template-columns: 1fr;
    }
    .seller-header {
        flex-direction: column;
        align-items: flex-start;
    }
    .home-btn {
        align-self: flex-start;
    }
}
/* ================= CARD ================= */
.seller-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    border: 1px solid #dcecff;
    box-shadow: 0 8px 30px rgba(20,70,120,.08);
}
.seller-card h3 {
    color: #0b3c82;
    font-size: 21px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid #e4f0ff;
}
/* ================= FORM ================= */
.form-group {
    margin-bottom: 17px;
}
.form-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
    color: #24324a;
}
.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #cbd9e8;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    background: white;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #2878c8;
    box-shadow: 0 0 0 3px rgba(40,120,200,.10);
}
.form-group textarea {
    min-height: 110px;
    resize: vertical;
}
/* ================= PRICE STOCK ================= */
.two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
@media(max-width:500px) {
    .two-column {
        grid-template-columns: 1fr;
    }
}
/* ================= IMAGE UPLOAD ================= */
.upload-box {
    border: 2px dashed #2878c8;
    background: #f5faff;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}
.upload-box:hover {
    background: #eaf5ff;
    border-color: #07599c;
}
.upload-icon {
    font-size: 38px;
    margin-bottom: 8px;
}
.upload-title {
    color: #0b4d8b;
    font-size: 16px;
    font-weight: bold;
}
.upload-subtitle {
    color: #718096;
    font-size: 12px;
    margin-top: 5px;
}
#productImage {
    display: none !important;
}
.image-count {
    margin-top: 10px;
    background: #eef6ff;
    color: #145a96;
    border: 1px solid #c8e1fa;
    padding: 10px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
    text-align: center;
}
/* ================= IMAGE PREVIEW ================= */
.preview-area {
    display: none;
    margin-top: 15px;
}
.preview-area.active {
    display: block;
}
.preview-title {
    font-weight: bold;
    color: #24324a;
    margin-bottom: 10px;
}
.preview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}
.preview-item {
    position: relative;
    height: 110px;
    border-radius: 10px;
    overflow: hidden;
    background: #f1f5f9;
    border: 1px solid #dce6f0;
}
.preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.remove-image {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 25px;
    height: 25px;
    border: none;
    border-radius: 50%;
    background: #dc2626;
    color: white;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}
.image-number {
    position: absolute;
    bottom: 5px;
    left: 5px;
    background: rgba(0,0,0,.7);
    color: white;
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 10px;
}
/* ================= GPS ================= */
.gps-box {
    background: #f5faff;
    border: 1px solid #d7e9fb;
    padding: 15px;
    border-radius: 12px;
}
.gps-button {
    width: 100%;
    border: none;
    background: linear-gradient(135deg,#082b63,#1764aa);
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
}
.gps-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 15px rgba(8,43,99,.2);
}
.gps-status {
    margin-top: 10px;
    font-size: 13px;
    color: #64748b;
    text-align: center;
}
.coordinates {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}
.coordinates input {
    background: #f1f5f9;
    color: #64748b;
}
/* ================= ADD BUTTON ================= */
.add-product-btn {
    width: 100%;
    border: none;
    background: linear-gradient(135deg,#082b63,#1764aa,#2388d4);
    color: white;
    padding: 16px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
    margin-top: 10px;
}
.add-product-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(8,43,99,.25);
}
.add-product-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}
/* ================= MESSAGE ================= */
.message {
    display: none;
    margin-top: 15px;
    padding: 13px 15px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: bold;
}
.message.success {
    display: block;
    background: #eaf8f0;
    color: #176b3a;
    border: 1px solid #bce7ca;
}
.message.error {
    display: block;
    background: #fff1f1;
    color: #a32121;
    border: 1px solid #efc0c0;
}
.message.info {
    display: block;
    background: #eef6ff;
    color: #145a96;
    border: 1px solid #c8e1fa;
}
/* ================= INVENTORY ================= */
.inventory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}
.refresh-btn {
    border: 1px solid #1764aa;
    background: white;
    color: #0b4d8b;
    padding: 9px 15px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}
.empty-products {
    text-align: center;
    padding: 40px 20px;
    color: #64748b;
}
.empty-products div {
    font-size: 45px;
    margin-bottom: 10px;
}
.product-list {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(210px,1fr));
    gap: 17px;
}
.product-item {
    border: 1px solid #dce6f0;
    border-radius: 13px;
    overflow: hidden;
    background: white;
    box-shadow: 0 5px 18px rgba(0,0,0,.05);
    position: relative;
}
.product-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #f1f5f9;
}
.product-details {
    padding: 15px;
}
.product-name {
    font-size: 16px;
    font-weight: bold;
    color: #172033;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.product-category-tag {
    display: inline-block;
    background: #eef6ff;
    color: #1764aa;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 10px;
}
.product-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.product-price {
    font-size: 17px;
    font-weight: 800;
    color: #0b4d8b;
}
.product-stock {
    font-size: 12px;
    color: #64748b;
}
.delete-product-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(220, 38, 38, 0.9);
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: 0.2s;
    z-index: 10;
}
.delete-product-btn:hover {
    background: #b91c1c;
    transform: scale(1.1);
}
</style>
</head>
<body>

<header class="seller-header">
    <div class="seller-brand">
        <!-- FIXED LOGO HANDLING SYNTAX -->
        <img src="https://postimg.co" alt="ShopNova Logo">
        <div class="seller-title">
            <h1>Seller Panel</h1>
            <p>Manage your ShopNova products</p>
        </div>
    </div>
    <a href="/" class="home-btn">← Back to ShopNova</a>
</header>

<main class="seller-container">
    <div class="welcome-card">
