<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova | Seller Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #eaf4ff; color: #183b68; padding: 20px; }
        .seller-card { background: white; border-radius: 20px; padding: 30px; max-width: 800px; margin: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
        .section-title { font-size: 20px; font-weight: 900; margin: 20px 0 10px; border-bottom: 2px solid #e4edf7; padding-bottom: 5px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 800; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbdced; border-radius: 10px; }
        .image-box { padding: 20px; border: 2px dashed #b9d5ef; background: #f8fbff; border-radius: 12px; text-align: center; }
        .select-image-button { display: inline-block; padding: 12px 20px; background: #1767d8; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; }
        #productImage { display: none; }
        .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; }
        .preview-card { position: relative; border: 1px solid #d9e6f3; border-radius: 8px; overflow: hidden; background: #eef5fc; }
        .preview-card img { width: 100%; height: 100px; object-fit: cover; }
        .remove-btn { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-weight: bold; }
        .submit-btn { width: 100%; padding: 16px; background: #00798c; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="seller-card">
        <h1>Seller Panel</h1>
        <form id="productForm">
            <div class="section-title">Product Information</div>
            <div class="form-group">
                <label>Product Title *</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>Price ($) *</label>
                <input type="number" id="price" required>
            </div>
            <div class="form-group">
                <label>Stock Quantity *</label>
                <input type="number" id="stock" required>
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select id="category" required>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description"></textarea>
            </div>

            <div class="section-title">Product Media</div>
            <div class="image-box">
                <label for="productImage" class="select-image-button">Select Images</label>
                <input type="file" id="productImage" accept="image/*" multiple>
                <div id="imageCountDisplay" style="margin-top: 10px; font-weight: bold;">0 images selected</div>
                <div class="image-preview-grid" id="previewGrid"></div>
            </div>

            <button type="submit" class="submit-btn">Publish Product Catalog</button>
        </form>
    </div>

    <script>
        let filesArray = [];
        const fileInput = document.getElementById('productImage');
        const previewGrid = document.getElementById('previewGrid');
        const countDisplay = document.getElementById('imageCountDisplay');

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (filesArray.length < 10) filesArray.push(file);
            });
            renderPreviews();
            fileInput.value = '';
        });

        function renderPreviews() {
            previewGrid.innerHTML = '';
            countDisplay.textContent = `${filesArray.length} image(s) selected`;
            filesArray.forEach((file, index) => {
                const reader = new FileReader();
                const card = document.createElement('div');
                card.className = 'preview-card';
                
                const img = document.createElement('img');
                const btn = document.createElement('button');
                btn.className = 'remove-btn';
                btn.innerHTML = '&times;';
                btn.onclick = () => { filesArray.splice(index, 1); renderPreviews(); };

                reader.onload = (e) => { img.src = e.target.result; };
                reader.readAsDataURL(file);

                card.appendChild(img);
                card.appendChild(btn);
                previewGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
