<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNova | Seller Panel</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eaf4ff, #d8ebff, #f5f9ff);
        color: #183b68;
    }

    /* ==============================
       HEADER
    ============================== */
    .seller-header {
        width: 100%;
        background: linear-gradient(90deg, #082b5f, #0d4f91, #155da8);
        color: white;
        box-shadow: 0 5px 20px rgba(0,35,90,.22);
    }

    .header-inner {
        width: 95%;
        max-width: 1200px;
        min-height: 75px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        text-decoration: none;
    }

    .brand-text {
        font-size: 22px;
        font-weight: 900;
    }

    .back-home {
        padding: 10px 17px;
        border-radius: 9px;
        background: rgba(255,255,255,.14);
        color: white;
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
    }

    .back-home:hover {
        background: rgba(255,255,255,.25);
    }

    /* ==============================
       MAIN LAYOUT
    ============================== */
    .page {
        width: 95%;
        max-width: 1100px;
        margin: 35px auto 50px;
    }

    .page-title {
        text-align: center;
        margin-bottom: 28px;
    }

    .page-title h1 {
        margin-top: 12px;
        color: #082b5f;
        font-size: clamp(30px,5vw,48px);
        font-weight: 950;
    }

    /* ==============================
       FORM CARD & GROUPS
    ============================== */
    .seller-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 12px 40px rgba(20,65,110,.12);
        border: 1px solid #dce9f7;
    }

    .section-title {
        color: #0b3d78;
        font-size: 20px;
        font-weight: 900;
        margin-top: 25px;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e4edf7;
    }

    .section-title:first-of-type {
        margin-top: 0;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        margin-bottom: 7px;
        color: #244b73;
        font-size: 13px;
        font-weight: 800;
    }

    input, textarea, select {
        width: 100%;
        border: 1px solid #cbdced;
        border-radius: 10px;
        padding: 12px 14px;
        outline: none;
        background: #fbfdff;
        color: #183b68;
        font-size: 14px;
        font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
        border-color: #3280e8;
        box-shadow: 0 0 0 3px rgba(50,128,232,.12);
        background: white;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    /* ==============================
       IMAGE MANAGEMENT BLOCK
    ============================== */
    .image-box {
        padding: 18px;
        border: 2px dashed #b9d5ef;
        border-radius: 12px;
        background: #f8fbff;
        margin-bottom: 20px;
    }

    .image-select-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .select-image-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 10px;
        background: linear-gradient(135deg, #1767d8, #0875b9);
        color: white;
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
        border: none;
        margin-bottom: 0;
    }

    .image-count {
        color: #1767d8;
        font-size: 13px;
        font-weight: 900;
    }

    .image-help {
        margin-top: 8px;
        color: #698198;
        font-size: 12px;
    }

    .image-preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 18px;
    }

    .image-preview-card {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid #d9e6f3;
        background: white;
    }

    .image-preview-card img {
        display: block;
        width: 100%;
        height: 150px;
        object-fit: contain;
        background: #eef5fc;
    }

    .image-preview-info {
        padding: 9px;
        text-align: center;
    }

    .image-name {
        overflow: hidden;
        color: #56708e;
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    /* ==============================
       LOCATION & NOTIFICATION STATES
    ============================== */
    .location-btn {
        background-color: #0076df;
        color: white;
        border: none;
        padding: 12px 20px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 12px;
        align-self: flex-start;
    }

    .status-msg {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 15px;
        display: none;
    }

    .status-msg.success { color: #2e7d32; display: block; }
    .status-msg.error { color: #c62828; display: block; }

    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(180deg, #00798c, #005c6a);
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .submit-btn:hover { opacity: 0.95; }

    .feedback-banner {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
        font-size: 14px;
        margin-top: 15px;
        display: none;
    }
    .feedback-banner.error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; display: block; }
    .feedback-banner.success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
</style>
</head>
<body>

<header class="seller-header">
    <div class="header-inner">
        <a href="#" class="brand">
            <div class="brand-text">ShopNova</div>
        </a>
        <a href="#" class="back-home">Back to Dashboard</a>
    </div>
</header>

<main class="page">
    <div class="page-title">
        <h1>Seller Catalog Portal</h1>
    </div>

    <div class="seller-card">
        <form id="productForm" enctype="multipart/form-data">
            
            <div class="section-title">1. Product Information</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="productTitle">Product Name *</label>
                    <input type="text" id="productTitle" name="title" placeholder="Example: One Step Closer T-Shirt" required>
                </div>
                
                <div class="form-group">
                    <label for="productPrice">Price *</label>
                    <input type="number" id="productPrice" name="price" step="0.01" placeholder="Example: 799" required>
                </div>

                <div class="form-group">
                    <label for="productStock">Stock *</label>
                    <input type="number" id="productStock" name="stock" placeholder="Example: 25" required>
                </div>

                <div class="form-group">
                    <label for="productCategory">Category *</label>
                    <select id="productCategory" name="category" required>
                        <option value="" disabled selected>Select a Category...</option>
                        <option value="fashion">Fashion & Apparel</option>
                        <option value="electronics">Electronics & Gadgets</option>
                        <option value="home">Home & Kitchen</option>
                        <option value="beauty">Beauty & Personal Care</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="productDescription">Product Description *</label>
                    <textarea id="productDescription" name="description" placeholder="Describe your product..." required></textarea>
                </div>
            </div>

            <div class="section-title">2. Product Images *</div>
            <div class="image-box">
                <div class="image-select-row">
                    <label for="productImage" class="select-image-button">Choose Files</label>
                    <input type="file" id="productImage" accept="image/*" multiple style="display: none;">
                    <span class="image-count" id="fileCounter">0 files staged</span>
                </div>
                <div class="image-help">Select multiple images at once. Maximum 10 images.</div>
                <div class="image-preview-grid" id="previewGrid"></div>
            </div>

            <div class="section-title">3. Seller Pickup Location</div>
            <p style="font-size: 13px; color: #56708e; margin-bottom: 12px;">Your GPS location can be used later for delivery tracking.</p>
