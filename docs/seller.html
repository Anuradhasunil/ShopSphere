<script>
    // Global array tracking selected files (matches your preview grid system logic)
    let filesArray = [];

    // Listen for image selection inputs to feed file states
    document.getElementById('productImage').addEventListener('change', function(e) {
        const selectedFiles = Array.from(e.target.files);
        filesArray = [...filesArray, ...selectedFiles];
        renderPreviews(); // Fires your visual grid card thumbnail builder
    });

    // 🚀 FORM SUBMISSION LOGIC
    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Intercepts native page reloads

        // 1. Instantiating a multi-part boundary wrapper
        const formData = new FormData();
        
        // 2. Fetch and append standard string value fields
        formData.append('title', document.getElementById('title').value.trim());
        formData.append('price', document.getElementById('price').value);
        formData.append('stock', document.getElementById('stock').value);
        formData.append('category', document.getElementById('category').value);
        formData.append('description', document.getElementById('description')?.value.trim() || "");

        // 3. Append multiple raw image files into the binary array payload
        if (filesArray.length > 0) {
            filesArray.forEach((file) => {
                formData.append('images', file); // Field name must match backend upload.array('images')
            });
        }

        try {
            // 4. Fire the async fetch mutation out to the port gateway
            const response = await fetch('http://localhost:5000/upload', {
                method: 'POST',
                body: formData 
                // NOTE: Do NOT declare an explicit 'Content-Type' header here. 
                // Leaving it out allows the browser to auto-assign the correct multipart/form-data boundary token string.
            });

            const result = await response.json();

            if (response.ok && result.success !== false) {
                alert('🎉 Catalog updated successfully! Product received.');
                window.location.href = 'products.html'; // Dynamic redirect to gallery layout
            } else {
                alert('⚠️ Publish execution failure: ' + (result.message || 'Unknown Server Error'));
            }
        } catch (error) {
            console.error('Critical Network Connection Failure:', error);
            alert('🚫 Transmission Failed: Unable to link up with the Node environment portal. Ensure "node server.js" is actively spinning up on Port 5000!');
        }
    });

    // Keeping your custom rendering architecture bound natively to the script scope
    function renderPreviews() {
        const previewGrid = document.getElementById('previewGrid');
        const countDisplay = document.getElementById('imageCountDisplay');
        
        if (countDisplay) countDisplay.textContent = `${filesArray.length} images selected`;
        if (!previewGrid) return;
        
        previewGrid.innerHTML = ''; // Fresh DOM sweep

        filesArray.forEach((file, index) => {
            const card = document.createElement('div');
            card.className = 'preview-card';

            const img = document.createElement('img');
            const reader = new FileReader(); // Fixed: declared locally inside scope iteration loop

            reader.onload = (e) => { img.src = e.target.result; };
            reader.readAsDataURL(file);

            const btn = document.createElement('button');
            btn.className = 'remove-btn';
            btn.innerHTML = '&times;';
            btn.type = 'button'; // Stops button clicks from submitting early
            btn.onclick = () => {
                filesArray.splice(index, 1);
                renderPreviews();
            };

            card.appendChild(img);
            card.appendChild(btn);
            previewGrid.appendChild(card);
        });
    }
</script>
