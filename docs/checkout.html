
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">🕊️ ShopNova</div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="checkout.html">Checkout</a>
            <a href="https://wa.me/919999999999" class="contact-btn">Contact</a>
        </nav>
    </header>

    <!-- CHECKOUT SECTION -->
    <section class="checkout-page">

        <h2>💳 Secure Checkout</h2>

        <form onsubmit="placeOrder(event)" class="checkout-form">

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Delivery Address</label>
            <input type="text" placeholder="Enter your delivery address" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email address" required>

            <label>Payment Method</label>
            <select required>
                <option value="">Select Payment Method</option>
                <option>UPI Payment</option>
                <option>Cash on Delivery</option>
                <option>Debit Card</option>
                <option>Credit Card</option>
            </select>

            <button type="submit" class="btn checkout-btn-full">
                Pay & Place Order
            </button>

        </form>

    </section>

    <footer>
        <p>© 2026 ShopNova • CEO & Founder: Anuradha</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
