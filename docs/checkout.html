<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova - Secure Checkout</title>
    <!-- Links directly to style.css in the same directory folder -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar Section -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo">🦅 ShopNova</div>
            <div class="search-container">
                <input type="text" placeholder="Search elite collections...">
                <button class="search-btn">🔍</button>
            </div>
        </div>
        <nav class="nav-right">
            <a href="index.html" class="nav-link">Home</a>
            <a href="products.html" class="nav-link">Products</a>
            <a href="cart.html" class="nav-link">Cart</a>
            <a href="checkout.html" class="nav-link active">Checkout</a>
            <button class="connect-hub-btn">Connect Hub 🌐</button>
        </nav>
    </header>

    <!-- Main Secure Checkout Wrapper -->
    <main class="checkout-wrapper">
        <h1 class="checkout-main-title">💳 Secure Checkout</h1>

        <div class="checkout-container-box">
            <h2 class="form-section-title">Shipping & Payment Details</h2>
            
            <form id="checkout-form" onsubmit="handlePlaceOrder(event)">
                
                <!-- Full Name Input Group -->
                <div class="input-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" placeholder="Enter your full name" required>
                </div>

                <!-- Delivery Address Input Group -->
                <div class="input-group">
                    <label for="address">Delivery Address</label>
                    <input type="text" id="address" placeholder="Enter your delivery address" required>
                </div>

                <!-- Two-Column Row for Contact Fields -->
                <div class="form-row-two-col">
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email address" required>
                    </div>
                </div>

                <!-- Payment Selection Dropdown Container -->
                <div class="input-group">
                    <label for="payment-method">Payment Method</label>
                    <select id="payment-method" required>
                        <option value="" disabled selected>Select Payment Method</option>
                        <option value="upi">UPI (GPay / PhonePe / Paytm)</option>
                        <option value="card">Credit / Debit Card</option>
                        <option value="netbanking">Net Banking</option>
                        <option value="cod">Cash on Delivery (COD)</option>
                    </select>
                </div>

                <!-- Form Submit Action Button -->
                <button type="submit" class="btn-place-order">Pay & Place Order →</button>
            </form>
        </div>
    </main>

    <!-- Footer Branding Section -->
    <footer class="cart-footer">
        <p>© 2026 ShopNova • Executive Board Directives • CEO & Founder: Anuradha</p>
    </footer>

    <!-- Hooks up script file interactions -->
    <script src="script.js"></script>
</body>
</html>
