<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova | Products</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           PRODUCTS PAGE
        ========================================= */

        .products-page {
            width: 100%;
            min-height: 100vh;
            padding: 30px 4%;
            background:
                linear-gradient(
                    180deg,
                    #f8fcfb,
                    #eef8f5
                );
        }

        .products-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .products-heading span {
            display: block;
            color: #087f68;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 7px;
        }

        .products-heading h1 {
            color: #143b58;
            font-size: 34px;
            margin-bottom: 7px;
        }

        .products-heading p {
            color: #708895;
            font-size: 14px;
        }

        .products-grid {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 20px;
        }

        .product-card {
            background: #ffffff;

            border:
                1px solid #dce9e6;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 5px 18px
                rgba(20, 70, 80, 0.06);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 28px
                rgba(20, 70, 80, 0.12);
        }

        .product-image {
            width: 100%;
            height: 220px;

            display: block;

            object-fit: cover;

            background: #eef5f3;
        }

        .product-info {
            padding: 17px;
        }

        .product-category {
            color: #00856b;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 1px;

            text-transform: uppercase;

            margin-bottom: 8px;
        }

        .product-name {
            color: #123c59;

            font-size: 18px;

            font-weight: 800;

            margin-bottom: 10px;
        }

        .product-price-row {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 16px;
        }

        .product-price {
            color: #087fa1;

            font-size: 24px;

            font-weight: 900;
        }

        .old-price {
            color: #9aaab0;

            font-size: 12px;

            text-decoration: line-through;

            font-weight: 700;
        }

        .add-cart-btn {
            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 13px;

            background:
                linear-gradient(
                    90deg,
                    #087fa1,
                    #0b8c72
                );

            color: #ffffff;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s ease;
        }

        .add-cart-btn:hover {
            background:
                linear-gradient(
                    90deg,
                    #066b89,
                    #08745f
                );
        }

        .empty-products {
            text-align: center;

            padding: 50px;

            color: #718792;

            grid-column: 1 / -1;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1100px) {

            .products-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }

        @media (max-width: 800px) {

            .products-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 14px;
            }

            .product-image {
                height: 190px;
            }

        }

        @media (max-width: 520px) {

            .products-page {
                padding: 22px 12px;
            }

            .products-heading h1 {
                font-size: 28px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 220px;
            }

        }
    </style>
</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<header class="main-header">

    <div class="header-inner">

        <!-- LOGO -->
        <a
            href="index.html"
            class="brand-logo"
        >
            <img
                src="images/shopnova-logo.png"
                alt="ShopNova Logo"
                onerror="this.onerror=null;this.src='images/logo.png';"
            >
        </a>


        <!-- SEARCH -->
        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                autocomplete="off"
            >

            <button
                type="button"
                onclick="searchProducts()"
            >
                🔍
            </button>

        </div>


        <!-- NAVIGATION -->
        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a
                href="products.html"
                class="active"
            >
                Products
            </a>

            <a href="cart.html">
                Cart
                <span id="cartCount">0</span>
            </a>

            <a href="checkout.html">
                Checkout
            </a>

            <button
                type="button"
                class="contact-btn"
                onclick="openContact()"
            >
                Contact
            </button>

        </nav>

    </div>

</header>


<!-- =========================================
     PRODUCTS
========================================= -->

<main class="products-page">

    <div class="products-heading">

        <span>
            SHOPNOVA COLLECTION
        </span>

        <h1>
            Premium Products
        </h1>

        <p>
            Discover fashion, beauty, technology and
            luxury essentials.
        </p>

    </div>


    <div
        class="products-grid"
        id="productsGrid"
    ></div>

</main>


<!-- =========================================
     CONTACT POPUP
========================================= -->

<div
    id="contactPopup"
    class="contact-popup"
>

    <div class="contact-box">

        <button
            type="button"
            class="close-contact"
            onclick="closeContact()"
        >
            ×
        </button>

        <h2>
            Contact ShopNova
        </h2>

        <p>
            We're happy to help you.
        </p>

        <div class="contact-links">

            <a
                href="https://wa.me/"
                target="_blank"
                rel="noopener"
            >
                💬 WhatsApp
            </a>

            <a
                href="https://instagram.com/"
                target="_blank"
                rel="noopener"
            >
                📸 Instagram
            </a>

            <a
                href="https://youtube.com/"
                target="_blank"
                rel="noopener"
            >
                ▶ YouTube
            </a>

            <a href="mailto:support@shopnova.com">
                ✉ Email
            </a>

        </div>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>

/* =========================================
   UNIQUE SHOPNOVA PRODUCTS
========================================= */

const products = [

    {
        id: 1,
        name: "Loungewear",
        category: "Fashion",
        price: 1299,
        oldPrice: 1999,
        image: "images/loungewear.jpg"
    },

    {
        id: 2,
        name: "Premium Sunglasses",
        category: "Accessories",
        price: 1599,
        oldPrice: 2499,
        image: "images/sunglasses.jpg"
    },

    {
        id: 3,
        name: "Men's Shoes",
        category: "Fashion",
        price: 2499,
        oldPrice: 3999,
        image: "images/mens-shoes.jpg"
    },

    {
        id: 4,
        name: "Luxury Perfume",
        category: "Beauty",
        price: 1799,
        oldPrice: 2699,
        image: "images/perfume.jpg"
    },

    {
        id: 5,
        name: "Formal Suit",
        category: "Fashion",
        price: 4999,
        oldPrice: 7499,
        image: "images/suit.jpg"
    },

    {
        id: 6,
        name: "Supercar Key",
        category: "Luxury",
        price: 2999,
        oldPrice: 4499,
        image: "images/supercar-key.jpg"
    },

    {
        id: 7,
        name: "Premium Watch",
        category: "Technology",
        price: 2999,
        oldPrice: 4999,
        image: "images/watch.jpg"
    },

    {
        id: 8,
        name: "Premium Handbag",
        category: "Luxury",
        price: 3499,
        oldPrice: 5499,
        image: "images/bag.jpg"
    },

    {
        id: 9,
        name: "Wireless Earbuds",
        category: "Technology",
        price: 1999,
        oldPrice: 2999,
        image: "images/earbuds.jpg"
    },

    {
        id: 10,
        name: "Premium Makeup",
        category: "Beauty",
        price: 1499,
        oldPrice: 2299,
        image: "images/makeup.jpg"
    }

];


/* =========================================
   RENDER PRODUCTS
   ONLY ONE TIME
========================================= */

function displayProducts(list) {

    const grid =
        document.getElementById(
            "productsGrid"
        );

    if (!grid) return;


    grid.innerHTML = "";


    if (
        !list ||
        list.length === 0
    ) {

        grid.innerHTML = `
            <div class="empty-products">
                No products found.
            </div>
        `;

        return;

    }


    list.forEach(function(product) {

        const card =
            document.createElement("article");


        card.className =
            "product-card";


        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
                onerror="
                    this.onerror=null;
                    this.src='images/luxury-banner.jpg';
                "
            >

            <div class="product-info">

                <div class="product-category">
                    ${product.category}
                </div>

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-price-row">

                    <span class="product-price">
                        ₹${product.price.toLocaleString("en-IN")}
                    </span>

                    <span class="old-price">
                        ₹${product.oldPrice.toLocaleString("en-IN")}
                    </span>

                </div>

                <button
                    type="button"
                    class="add-cart-btn"
                    onclick="addToCart(${product.id})"
                >
                    Add to Cart
                </button>

            </div>
        `;


        grid.appendChild(card);

    });

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(id) {

    const product =
        products.find(
            item => item.id === id
        );


    if (!product) return;


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "shopnova_cart"
                ) || "[]"
            );

    } catch (error) {

        cart = [];

    }


    if (!Array.isArray(cart)) {

        cart = [];

    }


    const existing =
        cart.find(
            item =>
                Number(item.id) ===
                Number(product.id)
        );


    if (existing) {

        existing.quantity =
            Number(existing.quantity || 1) + 1;

    } else {

        cart.push({

            id: product.id,

            name: product.name,

            category: product.category,

            price: product.price,

            oldPrice: product.oldPrice,

            image: product.image,

            quantity: 1

        });

    }


    localStorage.setItem(
        "shopnova_cart",
        JSON.stringify(cart)
    );


    updateCartCount();


    alert(
        product.name +
        " added to cart!"
    );

}


/* =========================================
   CART COUNT
========================================= */

function updateCartCount() {

    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "shopnova_cart"
                ) || "[]"
            );

    } catch (error) {

        cart = [];

    }


    let total = 0;


    if (Array.isArray(cart)) {

        cart.forEach(function(item) {

            total +=
                Number(
                    item.quantity || 1
                );

        });

    }


    const count =
        document.getElementById(
            "cartCount"
        );


    if (count) {

        count.textContent =
            total;

    }

}


/* =========================================
   SEARCH
========================================= */

function searchProducts() {

    const input =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    if (!input) {

        displayProducts(products);

        return;

    }


    const filtered =
        products.filter(function(product) {

            return (

                product.name
                    .toLowerCase()
                    .includes(input)

                ||

                product.category
                    .toLowerCase()
                    .includes(input)

            );

        });


    displayProducts(filtered);

}


/* =========================================
   ENTER SEARCH
========================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                searchProducts();

            }

        }
    );


/* =========================================
   CONTACT
========================================= */

function openContact() {

    document
        .getElementById(
            "contactPopup"
        )
        .classList.add("show");

}


function closeContact() {

    document
        .getElementById(
            "contactPopup"
        )
        .classList.remove("show");

}


/* =========================================
   START PAGE
========================================= */

displayProducts(products);

updateCartCount();

</script>

</body>
</html>
