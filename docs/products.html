<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova | Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f9ff;
            color: #183b68;
        }

        /* =====================================================
           HEADER DESIGN LAYER
        ===================================================== */
        header {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: linear-gradient(90deg, #082b5f, #0d4f91, #155da8);
            box-shadow: 0 5px 20px rgba(0,35,90,.22);
        }

        .header-inner {
            width: 97%;
            max-width: 1450px;
            min-height: 76px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* LOGO GRAPHICS ROUNDED BOX */
        .brand-logo-container {
            width: 70px;
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 13px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,.18);
        }

        .brand-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* SEARCH TRACKS */
        .search-box {
            height: 46px;
            flex: 1;
            max-width: 650px;
            display: flex;
            overflow: hidden;
            background: white;
            border: 2px solid #b9d5ff;
            border-radius: 13px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 0 17px;
            font-size: 14px;
        }

        .search-box button {
            width: 58px;
            border: none;
            background: #2464e8;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* NAVIGATION INTERFACE LINKS */
        .nav-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 750;
            padding: 10px 12px;
            border-radius: 9px;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,.15);
        }

        .contact-btn {
            border: none;
            color: white;
            background: #e83e8c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            padding: 10px 13px;
            border-radius: 9px;
            cursor: pointer;
            white-space: nowrap;
        }

        .contact-btn:hover {
            background: #d72f7c;
            transform: translateY(-1px);
        }

        #cartCount {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            margin-left: 3px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 900;
        }

        /* =====================================================
           HERO BANNER LAYOUT
        ===================================================== */
        .hero {
            padding: 50px 20px;
            text-align: center;
            background: linear-gradient(135deg, #dcecff, #acd3f7, #7db7e7);
        }

        .hero h1 {
            color: #0a2856;
            font-size: clamp(38px,6vw,65px);
            font-weight: 950;
            margin-bottom: 12px;
        }

        .hero p {
            color: #28577e;
            font-size: 15px;
        }

        /* =====================================================
           CATALOG ITEMS DISPLAY GRID CONTAINER
        ===================================================== */
        .products-container {
            width: 94%;
            max-width: 1300px;
            margin: 35px auto 50px;
        }

        .products-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .products-title h2 {
            color: #123e70;
            font-size: 30px;
            font-weight: 900;
        }

        .products-title p {
            color: #70859c;
            margin-top: 5px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 17px;
            overflow: hidden;
            border: 1px solid #dce7f4;
            box-shadow: 0 8px 25px rgba(25, 70, 115, .10);
            transition: transform .25s ease, box-shadow .25s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(25, 70, 115, .18);
        }

        /* =====================================================
           AMAZON / FLIPKART STYLE SWIPEABLE SCROLLING MECHANICS
        ===================================================== */
        .product-image {
            display: flex !important;
            overflow-x: auto !important;
            scroll-snap-type: x mandatory !important;
            scroll-behavior: smooth;
            width: 100%;
            height: 320px;
            background: #f3f7fc;
            position: relative;
        }

        /* Hide the horizontal scrollbar tracks for clear user interfaces */
        .product-image::-webkit-scrollbar {
            display: none;
        }

        .product-image img {
            width: 100% !important;
            height: 100% !important;
            flex-shrink: 0 !important;
            scroll-snap-align: start !important;
            object-fit: contain;
            background: #f3f7fc;
            padding: 10px;
        }

        /* Swipe label hint bubble overlay layout */
        .scroll-hint-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(8, 43, 95, 0.75);
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.5px;
        }

        .product-info-wrap {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
            background: white;
            border-top: 1px solid #edf4fc;
        }

        .product-info-wrap h3 {
            color: #0a2856;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .product-info-wrap .category-label {
            color: #70859c;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .product-info-wrap .description-text {
            color: #56708e;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .product-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px dashed #e4edf7;
        }

        .price-tag {
            font-size: 22px;
            font-weight: 800;
            color: #155da8;
        }

        .add-cart-btn {
            background: #2464e8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-cart-btn:hover {
            background: #0d4f91;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <!-- LOGO INTEGRATION POINTING TO YOUR INTERNAL VS CODE FILE SIDEBAR -->
            <div class="brand-logo-container">
                <img src="images/shopnova-header-logo.png" alt="ShopNova Logo" onerror="this.src='../docs/images/shopnova-header-logo.png'; this.onerror=function(){this.src='https://placeholder.com'}">
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Search product catalogs...">
                <button>🔍</button>
            </div>
            
            <nav class="nav-links">
                <a href="/products.html" class="active">Products</a>
                <a href="/seller.html">Seller Panel</a>
                <a href="#">Cart <span id="cartCount">0</span></a>
            </nav>
            <button class="contact-btn">Contact Support</button>
        </div>
    </header>

    <section class="hero">
        <h1>Our Products</h1>
        <p>Explore high quality items verified and deployed securely with Vercel cloud architecture layers.</p>
    </section>

    <main class="products-container">
        <div class="products-title">
            <h2>Live Catalog</h2>
