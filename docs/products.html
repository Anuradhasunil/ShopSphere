<!-- =====================================================

===================================================== -->

    },


    {

    },


    {
        id: 11,
        name: "Premium Watch",
        category: "Technology",

        image: "images/watch.jpg"
    },


    /* =================================================
       NEW PRODUCT

       WHEN YOU HAVE YOUR NEW PRODUCT IMAGE:

       1. Put it inside:
          docs/images/

       2. Change the image filename below.

       3. Change name/category/price.

       DO NOT add another watch or Bible here.
    ================================================= */


    {
        id: 12,
        name: "New Product",
        category: "New Collection",
        price: 999,
        oldPrice: 1499,
        image: "images/new-product.jpg",
        newProduct: true
    }


];



/* =====================================================
   DISPLAY PRODUCTS

   This function clears the grid first.
   Therefore products cannot duplicate.
===================================================== */


function displayProducts(productList) {


    const grid =
        document.getElementById(
            "productsGrid"
        );


    if (!grid) {

        return;

    }


    /* IMPORTANT */

    grid.innerHTML = "";


    if (
        !Array.isArray(productList) ||
        productList.length === 0
    ) {

        grid.innerHTML = `

            <div class="no-products">

                <div class="no-products-icon">
                    🔎
                </div>

                <h2>
                    No products found
                </h2>

                <p>
                    Try another search.
                </p>

            </div>

        `;

        return;

    }


    productList.forEach(
        function(product) {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";


            if (
                product.newProduct
            ) {

                card.classList.add(
                    "new-product-card"
                );

            }


            card.innerHTML = `

                <div class="product-image-wrap">


                    ${
                        product.newProduct

                        ?

                        `
                        <div class="new-badge">
                            NEW
                        </div>
                        `

                        :

                        ""

                    }


                    <img

                        class="product-image"

                        src="${product.image}"

                        alt="${product.name}"

                        loading="lazy"

                        onerror="
                            this.onerror=null;
                            this.src='images/luxury-banner.jpg';
                        "

                    >

                </div>


                <div class="product-info">


                    <div class="product-category">

                        ${product.category}

                    </div>


                    <h2 class="product-name">

                        ${product.name}

                    </h2>


                    <div class="price-row">


                        <span class="product-price">

                            ₹${product.price.toLocaleString("en-IN")}

                        </span>


                        <span class="old-price">

                            ₹${product.oldPrice.toLocaleString("en-IN")}

                        </span>


                    </div>


                    <button

                        type="button"

                        class="add-cart-btn"

                        onclick="addToCart(${product.id})"

                    >

                        🛒 Add to Cart

                    </button>


                </div>

            `;


            grid.appendChild(
                card
            );


        }
    );

}



/* =====================================================
   ADD TO CART
===================================================== */


function addToCart(
    productId
) {


    const product =
        products.find(
            function(item) {

                return Number(item.id)
                    ===
                    Number(productId);

            }
        );


    if (!product) {

        return;

    }


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "shopnova_cart"
                )
                ||
                "[]"
            );

    }

    catch(error) {

        cart = [];

    }


    if (
        !Array.isArray(cart)
    ) {

        cart = [];

    }


    const existing =
        cart.find(
            function(item) {

                return (
                    Number(item.id)
                    ===
                    Number(product.id)
                );

            }
        );


    if (existing) {

        existing.quantity =
            Number(
                existing.quantity || 1
            )
            +
            1;

    }

    else {

        cart.push({

            id: product.id,

            name: product.name,

            category: product.category,

            price: product.price,

            oldPrice: product.oldPrice,

            image: product.image,

            quantity: 1

        });

    }


    localStorage.setItem(

        "shopnova_cart",

        JSON.stringify(cart)

    );


    updateCartCount();


    alert(
        product.name +
        " added to cart!"
    );

}



/* =====================================================
   CART COUNT
===================================================== */


function updateCartCount() {


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "shopnova_cart"
                )
                ||
                "[]"
            );

    }

    catch(error) {

        cart = [];

    }


    if (
        !Array.isArray(cart)
    ) {

        cart = [];

    }


    let total = 0;


    cart.forEach(
        function(item) {

            total +=
                Number(
                    item.quantity || 1
                );

        }
    );


    const count =
        document.getElementById(
            "cartCount"
        );


    if (count) {

        count.textContent =
            total;

    }

}



/* =====================================================
   SEARCH
===================================================== */


function searchProducts() {


    const input =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    if (!input) {

        displayProducts(
            products
        );

        return;

    }


    const filtered =
        products.filter(
            function(product) {


                return (

                    product.name
                        .toLowerCase()
                        .includes(input)

                    ||

                    product.category
                        .toLowerCase()
                        .includes(input)

                );

            }
        );


    displayProducts(
        filtered
    );

}



/* =====================================================
   SEARCH BUTTON
===================================================== */


document
    .getElementById(
        "searchButton"
    )
    .addEventListener(
        "click",
        searchProducts
    );



/* =====================================================
   ENTER KEY SEARCH
===================================================== */


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key ===
                "Enter"
            ) {

                searchProducts();

            }

        }
    );



/* =====================================================
   CONTACT POPUP
===================================================== */


const contactPopup =
    document.getElementById(
        "contactPopup"
    );


const contactButton =
    document.getElementById(
        "contactButton"
    );


const closeContact =
    document.getElementById(
        "closeContact"
    );


contactButton.addEventListener(
    "click",
    function() {

        contactPopup.classList.add(
            "show"
        );

    }
);


closeContact.addEventListener(
    "click",
    function() {

        contactPopup.classList.remove(
            "show"
        );

    }
);


contactPopup.addEventListener(
    "click",
    function(event) {


        if (
            event.target ===
            contactPopup
        ) {

            contactPopup.classList.remove(
                "show"
            );

        }

    }
);



/* =====================================================
   INITIAL LOAD
===================================================== */


displayProducts(
    products
);


updateCartCount();


</script>
