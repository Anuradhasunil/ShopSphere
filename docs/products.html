<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova - Product Showcase</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #1e3a8a; text-align: center; margin-bottom: 30px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .product-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #e5e7eb; }
        .product-title { font-size: 1.2rem; font-weight: bold; margin: 0 0 10px 0; color: #111827; }
        .product-desc { font-size: 0.9rem; color: #6b7280; line-height: 1.4; margin-bottom: 15px; flex-grow: 1; }
        .product-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f3f4f6; padding-top: 10px; }
        .product-price { font-size: 1.3rem; font-weight: 700; color: #10b981; }
        .product-stock { font-size: 0.85rem; background: #d1fae5; color: #065f46; padding: 4px 8px; border-radius: 20px; }
        .product-category { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #3b82f6; font-weight: 600; margin-bottom: 5px; display: block; }
        #no-products { grid-column: 1 / -1; text-align: center; color: #9ca3af; padding: 5px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Premium Product Catalog</h1>
        <div class="product-grid" id="catalog-container">
            <!-- Products are injected dynamically by JavaScript here -->
            <p id="no-products">Loading live store inventory content...</p>
        </div>
    </div>

    <script>
        // Dynamically fetch items from your backend server API route
        async function loadCatalog() {
            const container = document.getElementById('catalog-container');
            try {
                // Pointing to your serverless backend route relative to root domain
                const response = await fetch('/api/products');
                if (!response.ok) throw new Error('Network payload resolution error');
                
                const products = await response.json();
                
                if(products.length === 0) {
                    container.innerHTML = '<p id="no-products">No active items in catalog array. Use seller workspace panel to add items.</p>';
                    return;
                }
                
                container.innerHTML = ''; // Clear out initialization status loaders
                
                products.forEach(item => {
                    // Fallback to placeholder if imagery array array is missing parameters
                    const mainImage = (item.images && item.images.length > 0) ? item.images[0] : 'https://placeholder.com';
                    
                    const cardMarkup = `
                        <div class="product-card">
                            <div>
                                <img src="${mainImage}" class="product-img" alt="${item.name}">
                                <span class="product-category">${item.category || 'General'}</span>
                                <h3 class="product-title">${item.name}</h3>
                                <p class="product-desc">${item.description || 'No description text provided.'}</p>
                            </div>
                            <div class="product-meta">
                                <span class="product-price">$${item.price}</span>
                                <span class="product-stock">Stock: ${item.stock || 0} left</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardMarkup;
                });
            } catch (err) {
                console.error('Failed to resolve dynamic product synchronization:', err);
                container.innerHTML = '<p id="no-products" style="color: #ef4444;">Failed to sync live application store contents lists.</p>';
            }
        }

        // Initialize script loop context
        window.addEventListener('DOMContentLoaded', loadCatalog);
    </script>
</body>
</html>
