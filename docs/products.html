<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova | Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f9ff;
            color: #183b68;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: linear-gradient(90deg,#082b5f,#0d4f91,#155da8);
            box-shadow: 0 5px 20px rgba(0,35,90,.22);
        }

        .header-inner {
            width: 97%;
            max-width: 1450px;
            min-height: 76px;
            margin: auto;

            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo {
            width: 70px;
            height: 60px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            border-radius: 13px;
            overflow: hidden;

            box-shadow: 0 5px 15px rgba(0,0,0,.18);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .search-box {
            height: 46px;
            flex: 1;
            max-width: 650px;

            display: flex;
            overflow: hidden;

            background: white;
            border: 2px solid #b9d5ff;
            border-radius: 13px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 0 17px;
            font-size: 14px;
        }

        .search-box button {
            width: 58px;
            border: none;
            background: #2464e8;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .nav-links {
            margin-left: auto;

            display: flex;
            align-items: center;
            gap: 3px;

            white-space: nowrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 750;
            padding: 10px 12px;
            border-radius: 9px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(255,255,255,.15);
        }

        #cartCount {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 20px;
            height: 20px;

            padding: 0 5px;
            margin-left: 3px;

            border-radius: 50%;

            background: #ef4444;
            color: white;

            font-size: 10px;
            font-weight: 900;
        }

        .hero {
            padding: 50px 20px;
            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #dcecff,
                    #acd3f7,
                    #7db7e7
                );
        }

        .hero h1 {
            color: #0a2856;
            font-size: clamp(38px,6vw,65px);
            font-weight: 950;
            margin-bottom: 12px;
        }

        .hero p {
            color: #28577e;
            font-size: 15px;
        }

        .products-container {
            width: 94%;
            max-width: 1300px;
            margin: 35px auto 50px;
        }

        .products-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .products-title h2 {
            color: #123e70;
            font-size: 30px;
            font-weight: 900;
        }

        .products-title p {
            color: #70859c;
            margin-top: 5px;
        }

        .product-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0,1fr));

            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 17px;
            overflow: hidden;

            border: 1px solid #dce7f4;

            box-shadow:
                0 8px 25px rgba(25,70,115,.10);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 15px 35px rgba(25,70,115,.18);
        }

        .product-image {
            width: 100%;
            height: 230px;
            background: #f3f7fc;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 17px;
        }

        .product-info h3 {
            color: #123c68;
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 7px;
        }

        .product-info p {
            color: #72849a;
            font-size: 12px;
            line-height: 1.5;
            min-height: 36px;
        }

        .price {
            color: #155dcc;
            font-size: 21px;
            font-weight: 950;
            margin: 12px 0;
        }

        .add-cart-btn {
            width: 100%;
            border: none;
            border-radius: 10px;

            padding: 12px;

            background:
                linear-gradient(
                    135deg,
                    #1767d8,
                    #0875b9
                );

            color: white;

            font-size: 13px;
            font-weight: 900;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .add-cart-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(23,103,216,.25);
        }

        footer {
            padding: 25px;
            text-align: center;

            background: #092c5d;
            color: white;
        }

        footer p {
            color: #d7e7fa;
            margin-top: 5px;
            font-size: 13px;
        }

        @media(max-width:1050px) {

            .product-grid {
                grid-template-columns:
                    repeat(3,1fr);
            }

            .header-inner {
                flex-wrap: wrap;
            }

            .search-box {
                order: 3;
                width: 100%;
                max-width: none;
            }
        }

        @media(max-width:750px) {

            .product-grid {
                grid-template-columns:
                    repeat(2,1fr);
            }

            .nav-links a {
                font-size: 12px;
                padding: 8px 6px;
            }

            .brand-logo {
                width: 60px;
                height: 52px;
            }
        }

        @media(max-width:500px) {

            .product-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                overflow-x: auto;
            }

            .hero {
                padding: 35px 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="brand-logo">

            <img
                src="images/shopnova-logo.png"
                alt="ShopNova"
            >

        </a>


        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Search products..."
            >

            <button
                type="button"
                id="searchButton"
            >
                🔍
            </button>

        </div>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a
                href="products.html"
                class="active"
            >
                Products
            </a>

            <a href="cart.html">
                Cart
                <span id="cartCount">0</span>
            </a>

            <a href="checkout.html">
                Checkout
            </a>

        </nav>

    </div>

</header>


<section class="hero">

    <h1>
        Shop Our Products
    </h1>

    <p>
        Discover premium products and beautiful choices.
    </p>

</section>


<main class="products-container">

    <div class="products-title">

        <h2>
            Featured Products
        </h2>

        <p>
            Shop your favourite products from ShopNova.
        </p>

    </div>


    <div
        id="productGrid"
        class="product-grid"
    ></div>

</main>


<footer>

    <h3>
        ShopNova
    </h3>

    <p>
        Shop Smart • Live Better
    </p>

    <p>
        © 2026 ShopNova | CEO & Founder: Anuradha
    </p>

</footer>


<script>

"use strict";


/* =====================================================
   CART KEY
===================================================== */

const CART_KEY = "shopnova_cart";


/* =====================================================
   PRODUCT DATA
===================================================== */

const products = [

    {
        id: "bible-wonders",
        name: "Bible Wonders",
        price: 599,
        image: "images/bible-wonders.jpg"
    },

    {
        id: "womens-shoes",
        name: "Women's Shoes",
        price: 1999,
        image: "images/womens-shoes.jpg"
    },

    {
        id: "mens-shoes",
        name: "Men's Shoes",
        price: 1499,
        image: "images/mens-shoes.jpg"
    },

    {
        id: "mens-suit",
        name: "Men's Suit",
        price: 2999,
        image: "images/suit.jpg"
    },

    {
        id: "loungewear",
        name: "Premium Loungewear",
        price: 1299,
        image: "images/loungewear.jpg"
    },

    {
        id: "sunglasses",
        name: "Premium Sunglasses",
        price: 999,
        image: "images/sunglasses.jpg"
    },

    {
        id: "bag",
        name: "Luxury Bag",
        price: 2499,
        image: "images/bag.jpg"
    },

    {
        id: "earbuds",
        name: "Wireless Earbuds",
        price: 1799,
        image: "images/earbuds.jpg"
    },

    {
        id: "makeup",
        name: "Premium Makeup",
        price: 1499,
        image: "images/makeup.jpg"
    },

    {
        id: "perfume",
        name: "Luxury Perfume",
        price: 1999,
        image: "images/perfume.jpg"
    },

    {
        id: "watch",
        name: "Smart Watch",
        price: 2999,
        image: "images/watch.jpg"
    },

    {
        id: "supercar-key",
        name: "Supercar Key",
        price: 4999,
        image: "images/supercar-key.jpg"
    }

];


/* =====================================================
   GET CART
===================================================== */

function getCart() {

    try {

        const saved =
            localStorage.getItem(CART_KEY);

        if (!saved) {
            return [];
        }

        const cart =
            JSON.parse(saved);

        return Array.isArray(cart)
            ? cart
            : [];

    } catch (error) {

        console.error(error);

        return [];
    }
}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(cart) {

    localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
    );

    updateCartCount();
}


/* =====================================================
   ADD PRODUCT TO CART
===================================================== */

function addProductToCart(
    id,
    name,
    price,
    image
) {

    const cart = getCart();


    const existing =
        cart.find(function(item) {

            return String(item.id) ===
                String(id);

        });


    if (existing) {

        existing.quantity =
            (Number(existing.quantity) || 1) + 1;

        /*
         * IMPORTANT:
         * Always update the image.
         * This prevents an old watch image
         * from remaining attached to another product.
         */

        existing.name = name;
        existing.price = Number(price);
        existing.image = image;

    } else {

        cart.push({

            id: String(id),

            name: String(name),

            price: Number(price),

            image: String(image),

            quantity: 1

        });

    }


    saveCart(cart);


    showMessage(
        name + " added to cart!"
    );
}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list) {

    const grid =
        document.getElementById(
            "productGrid"
        );

    grid.innerHTML = "";


    if (!list.length) {

        grid.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#70859c;
                font-weight:700;
            ">
                No products found.
            </div>
        `;

        return;
    }


    list.forEach(function(product) {

        const card =
            document.createElement("article");

        card.className =
            "product-card";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="
                        this.onerror=null;
                        this.src='images/luxury-banner.jpg';
                    "
                >

            </div>

            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                <p>
                    Premium ShopNova collection.
                </p>

                <div class="price">
                    ₹${Number(product.price)
                        .toLocaleString("en-IN")}
                </div>

                <button
                    type="button"
                    class="add-cart-btn"
                    data-id="${product.id}"
                >
                    🛒 Add to Cart
                </button>

            </div>

        `;


        const button =
            card.querySelector(
                ".add-cart-btn"
            );


        button.addEventListener(
            "click",
            function() {

                addProductToCart(

                    product.id,

                    product.name,

                    product.price,

                    product.image

                );

            }
        );


        grid.appendChild(card);

    });
}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

    const cart =
        getCart();


    const count =
        cart.reduce(
            function(total, item) {

                return total +
                    (Number(item.quantity) || 1);

            },
            0
        );


    const element =
        document.getElementById(
            "cartCount"
        );


    if (element) {

        element.textContent =
            count;
    }
}


/* =====================================================
   SEARCH
===================================================== */

function setupSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const button =
        document.getElementById(
            "searchButton"
        );


    function search() {

        const text =
            input.value.trim();


        if (!text) {

            window.location.href =
                "products.html";

            return;
        }


        window.location.href =
            "products.html?search=" +
            encodeURIComponent(text);
    }


    button.addEventListener(
        "click",
        search
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                search();
            }

        }
    );
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(message) {

    let box =
        document.getElementById(
            "shopnovaMessage"
        );


    if (!box) {

        box =
            document.createElement("div");

        box.id =
            "shopnovaMessage";


        box.style.position =
            "fixed";

        box.style.right =
            "20px";

        box.style.bottom =
            "20px";

        box.style.zIndex =
            "999999";

        box.style.background =
            "linear-gradient(135deg,#1767d8,#0875b9)";

        box.style.color =
            "white";

        box.style.padding =
            "14px 20px";

        box.style.borderRadius =
            "12px";

        box.style.fontWeight =
            "800";

        box.style.fontSize =
            "13px";

        box.style.boxShadow =
            "0 10px 30px rgba(0,0,0,.25)";

        document.body.appendChild(box);
    }


    box.textContent =
        "✓ " + message;


    box.style.opacity =
        "1";


    clearTimeout(
        window.shopnovaMessageTimer
    );


    window.shopnovaMessageTimer =
        setTimeout(
            function() {

                box.style.opacity =
                    "0";

            },
            1800
        );
}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const search =
            params.get("search");


        if (search) {

            const filtered =
                products.filter(
                    function(product) {

                        return product.name
                            .toLowerCase()
                            .includes(
                                search.toLowerCase()
                            );

                    }
                );

            displayProducts(filtered);

        } else {

            displayProducts(products);

        }


        updateCartCount();

        setupSearch();

    }
);

</script>

</body>
</html>
