<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #071a3d;
    color: white;
    box-shadow: 0 3px 15px rgba(0,0,0,.15);
}

.header-main {
    width: 100%;
    max-width: 1450px;
    margin: auto;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
}

/* =========================
   SHOPNOVA LOGO
========================= */

.logo {
    min-width: 230px;
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    color: white;
}

.logo-art {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 12px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,.2);
}

.logo-art img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.logo-content {
    display: flex;
    flex-direction: column;
    line-height: 1;
}

.logo-name {
    font-size: 24px;
    font-weight: 900;
}

.logo-name .shop {
    color: #fff;
}

.logo-name .nova {
    color: #63b3ff;
}

.logo-tagline {
    margin-top: 4px;
    font-size: 8px;
    color: #cbd5e1;
    letter-spacing: .8px;
    font-weight: 700;
}

/* =========================
   SEARCH
========================= */

.search-box {
    flex: 1;
    max-width: 650px;
    height: 42px;
    display: flex;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
}

.search-box input {
    width: 100%;
    border: none;
    outline: none;
    padding: 0 14px;
    font-size: 14px;
    color: #172033;
}

.search-box button {
    width: 52px;
    border: none;
    background: #1769aa;
    color: white;
    cursor: pointer;
    font-size: 17px;
}

.search-box button:hover {
    background: #0d4f82;
}

/* =========================
   HEADER ACTIONS
========================= */

.header-actions {
    display: flex;
    align-items: center;
    gap: 3px;
}

.header-actions a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 10px;
    border-radius: 7px;
    white-space: nowrap;
}

.header-actions a:hover {
    background: rgba(255,255,255,.1);
}

.cart-link {
    background: #138808 !important;
}

.cart-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    margin-left: 3px;
    border-radius: 50%;
    background: #fff;
    color: #138808;
    font-size: 10px;
    font-weight: 900;
}

/* =========================
   NAVIGATION
========================= */

.nav-bar {
    background: #0b2858;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 7px 15px;
}

.nav-bar a {
    color: #e8eef8;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
}

.nav-bar a:hover,
.nav-bar a.active {
    color: #63b3ff;
}

/* =========================
   PRODUCTS PAGE HERO
========================= */

.hero {
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;

    padding: 25px 15px;

    background:
        linear-gradient(
            135deg,
            #071a3d 0%,
            #123b70 55%,
            #176b58 100%
        );
}

.hero-content {
    max-width: 850px;
    padding: 20px 25px;
}

.hero-badge {
    display: inline-block;
    padding: 6px 15px;
    border-radius: 20px;
    background: #ffffff;
    color: #071a3d;
    font-size: 10px;
    font-weight: 900;
    margin-bottom: 8px;
}

.hero h1 {
    color: white;
    font-size: clamp(32px,5vw,48px);
    font-weight: 900;
    margin-bottom: 7px;
}

.hero h1 span {
    color: #72d6a5;
}

.hero p {
    max-width: 700px;
    margin: auto;
    color: #dce8f7;
    font-size: 14px;
    line-height: 1.5;
}

/* =========================
   PRODUCTS SECTION
========================= */

.products-section {
    width: 100%;
    max-width: 1400px;
    margin: auto;

    /* SHORT MARGINS */
    padding: 25px 18px 35px;
}

.section-heading {
    text-align: center;
    margin-bottom: 20px;
}

.section-heading h2 {
    color: #071a3d;
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 4px;
}

.section-heading p {
    color: #697386;
    font-size: 13px;
}

/* =========================
   SEARCH RESULT
========================= */

.search-result {
    display: none;
    text-align: center;
    color: #071a3d;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 15px;
}

/* =========================
   PRODUCT GRID
========================= */

.products-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(235px, 1fr));

    /* SMALL GAP */
    gap: 18px;
}

/* =========================
   PRODUCT CARD
========================= */

.product-card {
    background: #fff;

    border-radius: 13px;

    overflow: hidden;

    border: 1px solid #e1e7ef;

    box-shadow:
        0 5px 18px rgba(7,26,61,.07);

    display: flex;
    flex-direction: column;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.product-card:hover {
    transform: translateY(-4px);

    box-shadow:
        0 10px 28px rgba(7,26,61,.13);
}

.product-card.featured {
    border: 2px solid #1769aa;
}

/* =========================
   PRODUCT IMAGE
========================= */

.product-image {
    height: 220px;

    background: #eef2f7;

    position: relative;

    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    transition: transform .35s ease;
}

.product-card:hover .product-image img {
    transform: scale(1.04);
}

/* =========================
   BADGES
========================= */

.sale-badge {
    position: absolute;

    top: 10px;
    left: 10px;

    z-index: 3;

    background: #e65f73;

    color: white;

    padding: 5px 9px;

    border-radius: 15px;

    font-size: 9px;

    font-weight: 900;
}

.featured-badge {
    position: absolute;

    top: 10px;
    right: 10px;

    z-index: 3;

    background: #1769aa;

    color: white;

    padding: 5px 9px;

    border-radius: 15px;

    font-size: 9px;

    font-weight: 900;
}

/* =========================
   PRODUCT INFO
========================= */

.product-info {
    padding: 14px;

    display: flex;
    flex-direction: column;

    flex: 1;
}

.product-category {
    color: #1769aa;

    font-size: 10px;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: .7px;

    margin-bottom: 4px;
}

.product-name {
    color: #071a3d;

    font-size: 17px;

    font-weight: 800;

    line-height: 1.25;

    min-height: 42px;
}

.product-description {
    color: #697386;

    font-size: 12px;

    line-height: 1.4;

    margin: 5px 0 10px;

    min-height: 34px;
}

.price-row {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 11px;
}

.price {
    color: #071a3d;

    font-size: 21px;

    font-weight: 900;
}

.old-price {
    color: #999;

    font-size: 12px;

    text-decoration: line-through;
}

/* =========================
   BUTTON
========================= */

.add-cart-btn {
    width: 100%;

    padding: 10px;

    border: none;

    border-radius: 8px;

    background: #071a3d;

    color: white;

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    margin-top: auto;

    transition: .25s;
}

.add-cart-btn:hover {
    background: #1769aa;

    transform: translateY(-1px);
}

.add-cart-btn.added {
    background: #138808;
}

/* =========================
   NO RESULTS
========================= */

.no-results {
    display: none;

    grid-column: 1 / -1;

    text-align: center;

    padding: 45px 20px;

    color: #667085;

    font-size: 16px;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #071a3d;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

footer h3 {
    font-size: 20px;
    font-weight: 900;
}

.footer-line {
    width: 55px;
    height: 2px;
    margin: 8px auto;
    background: #72d6a5;
}

footer p {
    color: #cbd5e1;
    font-size: 11px;
    line-height: 1.6;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1050px) {

    .header-main {
        flex-wrap: wrap;
        justify-content: center;
    }

    .logo {
        min-width: auto;
    }

    .search-box {
        order: 3;
        width: 100%;
        max-width: 100%;
    }

    .header-actions {
        justify-content: center;
    }
}

@media(max-width:700px) {

    .header-main {
        padding: 8px 12px;
    }

    .logo {
        width: 100%;
        justify-content: center;
    }

    .header-actions {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3,1fr);
    }

    .header-actions a {
        text-align: center;
        font-size: 11px;
        padding: 7px 4px;
    }

    .nav-bar {
        justify-content: flex-start;
        overflow-x: auto;
        white-space: nowrap;
        gap: 20px;
    }

    .hero {
        min-height: 170px;
        padding: 20px 12px;
    }

    .hero-content {
        padding: 15px;
    }

    .hero h1 {
        font-size: 31px;
    }

    .hero p {
        font-size: 12px;
    }

    .products-section {
        padding: 20px 12px 30px;
    }

    .section-heading {
        margin-bottom: 15px;
    }

    .section-heading h2 {
        font-size: 25px;
    }

    .products-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .product-image {
        height: 185px;
    }

    .product-info {
        padding: 11px;
    }

    .product-name {
        font-size: 15px;
    }

    .product-description {
        font-size: 11px;
        min-height: 31px;
    }

    .price {
        font-size: 18px;
    }

    .add-cart-btn {
        font-size: 11px;
        padding: 9px 5px;
    }
}

@media(max-width:430px) {

    .products-grid {
        grid-template-columns: 1fr;
    }

    .product-image {
        height: 230px;
    }
}
</style>
