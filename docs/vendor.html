<form id="vendorForm">

    <h3>Vendor Information</h3>

    <label>
        Business Name
        <input
            type="text"
            name="business"
            placeholder="Your business name"
            required>
    </label>

    <label>
        Owner Name
        <input
            type="text"
            name="owner"
            placeholder="Your full name"
            required>
    </label>

    <label>
        Email
        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required>
    </label>

    <label>
        Phone
        <input
            type="tel"
            name="phone"
            placeholder="+91 XXXXX XXXXX"
            required>
    </label>


    <h3>Product Information</h3>

    <label>
        Product Name
        <input
            type="text"
            name="productName"
            placeholder="Enter product name"
            required>
    </label>

    <label>
        Product Image
        <input
            type="file"
            name="productImage"
            id="productImage"
            accept="image/*"
            required>
    </label>

    <div class="image-preview" id="imagePreview">
        <span>Product image preview</span>
    </div>

    <label>
        Product Price
        <input
            type="number"
            name="price"
            placeholder="₹ Enter selling price"
            min="0"
            required>
    </label>

    <label>
        Original / MRP Price
        <input
            type="number"
            name="mrp"
            placeholder="₹ Enter MRP"
            min="0">
    </label>

    <label>
        Product Category
        <select name="category" required>
            <option value="">Select category</option>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Gaming</option>
            <option>Accessories</option>
            <option>Home & Kitchen</option>
            <option>Beauty</option>
            <option>Other</option>
        </select>
    </label>

    <label>
        Brand
        <input
            type="text"
            name="brand"
            placeholder="Enter brand name">
    </label>

    <label>
        Stock Quantity
        <input
            type="number"
            name="stock"
            placeholder="Available quantity"
            min="0"
            required>
    </label>

    <label>
        Product Description
        <textarea
            name="description"
            placeholder="Describe your product..."
            rows="5"
            required></textarea>
    </label>


    <h3>Business Location</h3>

    <label>
        Business Location

        <div class="location-input">

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter your business location"
                required>

            <button
                type="button"
                id="getLocation"
                class="location-btn">
                📍 Use My Location
            </button>

        </div>
    </label>

    <input
        type="hidden"
        id="latitude"
        name="latitude">

    <input
        type="hidden"
        id="longitude"
        name="longitude">


    <button
        type="submit"
        class="primary-btn full-button">
        Add Product
    </button>

</form>
    <!-- Other content above -->
    <script src="script.js"></script> 
    
    <!-- Paste the Vercel script right here -->
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
