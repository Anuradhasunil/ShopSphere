<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to ShopNova | Premium Marketplace</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f8f9fa; }
    .hero { background: linear-gradient(rgba(0,45,98,0.7), rgba(0,45,98,0.7)), url('https://unsplash.com'); background-size: cover; background-position: center; color: white; text-align: center; padding: 100px 20px; }
    .hero h1 { font-size: 42px; margin-bottom: 10px; }
    .hero p { font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
    .hero-btn { background: #ff8c00; color: white; padding: 12px 30px; text-decoration: none; border-radius: 25px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
    .hero-btn:hover { background: #e07b00; }
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .section-title { text-align: center; color: #002d62; font-size: 32px; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; text-align: center; padding-bottom: 20px; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card h3 { color: #333; margin: 15px 0 5px 0; padding: 0 15px; }
    .price { font-size: 20px; color: #28a745; font-weight: bold; margin: 10px 0; }
    .contact-bar { display: flex; gap: 10px; justify-content: center; padding: 0 15px; margin-top: auto; }
    .wa-btn { background: #25d366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: bold; flex: 1; }
    .mail-btn { background: #dc3545; color: white; padding: 10px 15px; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: bold; flex: 1; }
  </style>
</head>
<body>

  <!-- Dynamic Header Workspace Injection -->
  <div id="navbar-placeholder"></div>

  <!-- Corporate Hero Welcome Showcase Banner -->
  <div class="hero">
    <h1>Welcome to ShopNova</h1>
    <p>Premium shopping experience for fashion, gadgets, books and lifestyle products</p>
    <button class="hero-btn" onclick="window.location.href='products.html'">Explore Products</button>
  </div>

  <div class="container">
    <h2 class="section-title">Featured Products</h2>
    <div id="productGrid" class="grid"></div>
  </div>

  <script>
    const API_BASE_URL = 'https://vercel.app';

    // Inject Shared Premium Global Navbar
    fetch('navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
        setupAuthUI();
        // Bind Search Listener inside injected navbar
        document.getElementById('liveSearch').addEventListener('input', (e) => loadProducts(e.target.value));
      });

    function setupAuthUI() {
      const user = JSON.parse(localStorage.getItem('user'));
      const authLink = document.getElementById('authLink');
      if (user) {
        authLink.innerHTML = `
          <a href="admin.html" style="color: #ff8c00; text-decoration:none; margin-right:15px;">Dashboard</a>
          <a href="#" onclick="logout()" style="color: white; text-decoration:none;">Logout</a>
        `;
      } else {
        authLink.innerHTML = `<a href="login.html" style="color: white; text-decoration: none;">Login</a>`;
      }
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.reload();
    }

    async function loadProducts(query = '') {
      const url = query ? `${API_BASE_URL}/search?q=${query}` : `${API_BASE_URL}/products`;
      try {
        const res = await fetch(url);
        const products = await res.json();
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        products.forEach(p => {
          const waMsg = encodeURIComponent(`Hello ${p.sellerName}, I am interested in buying your item "${p.name}" listed on ShopNova.`);
          grid.innerHTML += `
            <div class="card">
              <img src="${p.image || 'https://placeholder.com'}" alt="${p.name}">
              <h3>${p.name}</h3>
              <p style="color:#666; font-size:14px; padding:0 15px;">${p.description || ''}</p>
              <div class="price">₹${p.price}</div>
              <div class="contact-bar">
                <a href="https://wa.me{p.sellerPhone}?text=${waMsg}" target="_blank" class="wa-btn">WhatsApp</a>
                <a href="mailto:${p.sellerEmail}?subject=Inquiry" class="mail-btn">Email</a>
              </div>
            </div>
          `;
        });
      } catch (err) { console.error(err); }
    }
    loadProducts();
  </script>
</body>
</html>
