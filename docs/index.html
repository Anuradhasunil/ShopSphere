<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova - Shop Smart. Live Better.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         SHOPNOVA HEADER
    ========================================== -->

    <header class="main-navbar">

        <!-- LOGO -->
        <div class="nav-logo">
            <a href="index.html">
                <img
                    src="images/shopnova-logo.png"
                    alt="ShopNova Logo"
                    class="mini-logo"
                >
            </a>
        </div>


        <!-- SEARCH BAR -->
        <div class="search-bar-container">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search products..."
                autocomplete="off"
            >

            <button
                type="button"
                id="searchBtn"
                class="search-btn"
                aria-label="Search"
            >
                🔍
            </button>

        </div>


        <!-- NAVIGATION -->
        <nav class="nav-links">

            <a
                href="index.html"
                class="active"
            >
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a
                href="cart.html"
                class="cart-link"
            >
                Cart
                <span class="cart-count">0</span>
            </a>

            <a href="checkout.html">
                Checkout
            </a>

            <!-- SINGLE CONTACT BUTTON -->
            <a
                href="contact.html"
                class="btn-contact"
            >
                Contact
            </a>

        </nav>

    </header>


    <!-- =========================================
         HERO SECTION
    ========================================== -->

    <main class="hero-section">


        <!-- LEFT SIDE -->
        <div class="hero-left-content">

            <!-- ANIMATED WELCOME -->
            <span class="welcome-badge animated-welcome">
                ✨ Welcome to ShopNova
            </span>


            <!-- ANIMATED 3D HEADING -->
            <h1 class="hero-main-heading animated-heading">

                Shop Smart.<br>

                <span class="blue-text">
                    Live Better.
                </span>

            </h1>


            <!-- DESCRIPTION -->
            <p class="hero-subtext">

                Discover premium products, modern style and
                everyday essentials all in one beautiful
                shopping experience.

            </p>


            <!-- HERO BUTTONS -->
            <div class="hero-cta-buttons">

                <a
                    href="products.html"
                    class="btn-primary"
                >
                    Start Shopping →
                </a>


                <a
                    href="cart.html"
                    class="btn-secondary"
                >
                    View Cart 🛒
                </a>

            </div>

        </div>



        <!-- =====================================
             RIGHT SIDE LOGO
        ====================================== -->

        <div class="hero-right-graphic">

            <div class="graphic-card-frame">

                <!--
                    DO NOT CHANGE THIS LOGO.
                    This is your existing ShopNova logo.
                -->

                <img
                    src="images/shopnova-logo.png"
                    alt="ShopNova Logo"
                    class="hero-logo-img animated-dove"
                >

            </div>

        </div>

    </main>



    <!-- =========================================
         ANIMATION CSS
         ONLY FOR THE TWO REQUESTED TEXT AREAS
    ========================================== -->

    <style>

        /* =====================================
           WELCOME TEXT
        ====================================== */

        .animated-welcome {

            display: inline-block;

            transform-origin: center;

            animation:
                welcomeFloat 3s ease-in-out infinite,
                welcomeGlow 2s ease-in-out infinite alternate;

        }


        /* Floating animation */

        @keyframes welcomeFloat {

            0% {

                transform:
                    translateY(0)
                    scale(1);

            }

            50% {

                transform:
                    translateY(-6px)
                    scale(1.03);

            }

            100% {

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* Glow animation */

        @keyframes welcomeGlow {

            from {

                box-shadow:
                    0 5px 15px
                    rgba(37, 99, 235, 0.15);

            }

            to {

                box-shadow:
                    0 8px 28px
                    rgba(37, 99, 235, 0.35),

                    0 0 18px
                    rgba(96, 165, 250, 0.25);

            }

        }



        /* =====================================
           MAIN HEADING 3D
        ====================================== */

        .animated-heading {

            perspective: 1000px;

            transform-style: preserve-3d;

            animation:
                heading3D 4s ease-in-out infinite;

            text-shadow:

                1px 1px 0 #dbeafe,

                2px 2px 0 #bfdbfe,

                3px 3px 0 #93c5fd,

                4px 4px 12px
                rgba(30, 64, 175, 0.20);

        }


        /* 3D movement */

        @keyframes heading3D {

            0% {

                transform:
                    perspective(1000px)
                    rotateX(0deg)
                    rotateY(0deg)
                    translateZ(0);

            }

            25% {

                transform:
                    perspective(1000px)
                    rotateX(2deg)
                    rotateY(-3deg)
                    translateZ(8px);

            }

            50% {

                transform:
                    perspective(1000px)
                    rotateX(0deg)
                    rotateY(3deg)
                    translateZ(12px);

            }

            75% {

                transform:
                    perspective(1000px)
                    rotateX(-2deg)
                    rotateY(-2deg)
                    translateZ(8px);

            }

            100% {

                transform:
                    perspective(1000px)
                    rotateX(0deg)
                    rotateY(0deg)
                    translateZ(0);

            }

        }



        /* =====================================
           LIVE BETTER BLUE SHINE
        ====================================== */

        .animated-heading .blue-text {

            display: inline-block;

            background:

                linear-gradient(
                    90deg,
                    #2563eb,
                    #60a5fa,
                    #1d4ed8,
                    #38bdf8,
                    #2563eb
                );

            background-size: 300% 100%;

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                blueShine 3s linear infinite;

            text-shadow: none;

        }


        /* Blue moving shine */

        @keyframes blueShine {

            0% {

                background-position:
                    0% 50%;

            }

            50% {

                background-position:
                    100% 50%;

            }

            100% {

                background-position:
                    0% 50%;

            }

        }



        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 700px) {

            .animated-heading {

                animation-duration: 4.5s;

                text-shadow:

                    1px 1px 0 #dbeafe,

                    2px 2px 0 #bfdbfe,

                    3px 3px 8px
                    rgba(30, 64, 175, 0.18);

            }


            .animated-welcome {

                animation-duration: 3.5s;

            }

        }



        /* =====================================
           ACCESSIBILITY
        ====================================== */

        @media (prefers-reduced-motion: reduce) {

            .animated-welcome,
            .animated-heading,
            .animated-heading .blue-text {

                animation: none;

            }

        }

    </style>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>
</html>
