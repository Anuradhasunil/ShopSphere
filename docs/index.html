<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova - Home</title>
    <style>
        /* =========================================================
           SHOPNOVA MODERN ECOMMERCE CORE STYLES
           ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            overflow-x: hidden;
            line-height: 1.6;
        }

        button, input {
            font-family: inherit;
        }

        a {
            text-decoration: none;
        }

        /* =========================================================
           STICKY HEADER & NAVIGATION
           ========================================================= */
        .shopnova-header {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 12px 4%;
        }

        .shopnova-navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* BRANDING & DOVE LOGO */
        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .dove-logo-icon {
            width: 44px;
            height: 44px;
        }

        .shopnova-logo {
            color: #0b1f4d;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .shopnova-logo span {
            color: #ff7a00;
        }

        /* SEARCH ARCHITECTURE */
        .shopnova-search {
            flex: 1;
            max-width: 450px;
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 999px;
            overflow: hidden;
            border: 1.5px solid transparent;
            transition: all 0.3s ease;
            margin: 0 15px;
        }

        .shopnova-search:focus-within {
            background: #ffffff;
            border-color: #ff7a00;
            box-shadow: 0 4px 15px rgba(255, 122, 0, 0.1);
        }

        .shopnova-search input {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            padding: 12px 20px;
            font-size: 15px;
            color: #172033;
            background: transparent;
        }

        .shopnova-search button {
            width: 55px;
            height: 44px;
            border: none;
            background: #ff7a00;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .shopnova-search button:hover {
            background: #e56600;
        }

        /* NAVIGATION LINKS */
        .shopnova-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .shopnova-nav a {
            color: #475569;
            font-size: 15px;
            font-weight: 700;
            transition: color 0.3s;
            position: relative;
            padding: 6px 0;
        }

        .shopnova-nav a:hover,
        .shopnova-nav a.active {
            color: #ff7a00;
        }

        .shopnova-nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ff7a00;
            border-radius: 999px;
        }

        /* ACTION COMPONENTS */
        .contact-button {
            border: none;
            background: linear-gradient(135deg, #ff7a00, #e56600);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 122, 0, 0.25);
            transition: all 0.3s ease;
        }

        .contact-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 122, 0, 0.35);
        }

        /* =========================================================
           HERO MONTAGE LAYOUT
           ========================================================= */
        .hero-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 5%;
        }

        .hero-card-wrapper {
            background: #ffffff;
            border-radius: 32px;
            padding: 60px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.02);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 60px;
            align-items: center;
        }

        .hero-left-details {
            max-width: 600px;
        }

        .hero-tagline {
            color: #ff7a00;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: block;
        }

        .hero-left-details h1 {
            font-size: clamp(2.3rem, 5vw, 4rem);
            color: #0b1f4d;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 24px;
        }

        .hero-left-details p {
            color: #64748b;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .hero-right-visual {
            background: linear-gradient(135deg, #0b1f4d 0%, #1a3673 100%);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            position: relative;
            overflow: hidden;
        }

        .brand-visual-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 340px;
            z-index: 2;
        }

        .brand-visual-box .dove-large {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            display: block;
        }

        .brand-visual-box h2 {
            font-size: 28px;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .brand-visual-box p {
            font-size: 13px;
            color: #a4b3cc;
            font-weight: 600;
        }

        /* =========================================================
           RESPONSIVE CONFIGURATION
           ========================================================= */
        @media (max-width: 1100px) {
            .shopnova-navbar {
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .shopnova-search {
                order: 3;
                margin: 10px 0 0 0;
                max-width: 100%;
                width: 100%;
            }
        }

        @media (max-width: 1024px) {
            .hero-card-wrapper {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 40px;
            }
            .hero-left-details {
                text-align: center;
                max-width: 100%;
            }
        }

        @media (max-width: 680px) {
            .shopnova-navbar {
                flex-direction: column;
                align-items: center;
                gap: 16px;
            }
            .shopnova-search {
                order: unset;
                margin: 0;
            }
            .shopnova-nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 16px;
            }
            .contact-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- STYLED HEADER NAVIGATION PANELS -->
    <header class="shopnova-header">
        <div class="shopnova-navbar">
            
            <div class="brand-wrapper">
                <!-- Noah's Ark White Dove with Olive Branch -->
                <svg class="dove-logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <!-- Green Olive Leaves -->
                    <path d="M19.5 5.5c-1-.8-2.5-.5-3.5.5m3.5-.5c0 1-.5 2.2-1.5 3m1.5-3l-3.5 2.5" stroke="#138808" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- White Dove Body with Dark Definition Outline -->
                    <path d="M2 12s3-6 10-6c2 0 4.5 1 5.5 3.5.8 1.8.3 4-1.5 5.2-2 1.2-5 .8-6.5 0-2.5-1.2-4.5-1.2-6.2-2.7z" fill="#ffffff" stroke="#0b1f4d" stroke-width="1.5" stroke-linejoin="round"/>
                    <!-- Wing Detailing -->
                    <path d="M11.5 6c-.8 2-2.2 4.2-4.5 5" stroke="#0b1f4d" stroke-width="1.2" stroke-linecap="round"/>
                    <!-- Eye -->
                    <circle cx="6.5" cy="8.2" r="0.8" fill="#0b1f4d"/>
                </svg>
                <div class="shopnova-logo">Shop<span>Nova</span></div>
            </div>
