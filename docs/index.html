<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova - Elite Collections</title>
    <!-- Links directly to style.css in the same folder -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar Section -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo">🦅 ShopNova</div>
            <div class="search-container">
                <input type="text" placeholder="Search elite collections...">
                <button class="search-btn">🔍</button>
            </div>
        </div>
        <nav class="nav-right">
            <a href="index.html" class="nav-link active">Home</a>
            <a href="products.html" class="nav-link">Products</a>
            <a href="cart.html" class="nav-link">Cart</a>
            <a href="checkout.html" class="nav-link">Checkout</a>
            <button class="connect-hub-btn">Connect Hub 🌐</button>
        </nav>
    </header>

    <!-- Main Hero Banner Section -->
    <section class="hero-section">
        <div class="hero-content">
            <span class="hero-badge">THE MILLIONAIRE COLLECTION</span>
            <h1 class="hero-title">Timeless Elegance 2026</h1>
            <p class="hero-subtitle">Curated Premium Fashion • Executive Timepieces • Elite Living</p>
            <a href="products.html" class="hero-btn">Explore The Catalog</a>
        </div>
        <div class="hero-image-container">
            <img src="images/suit.jpg" alt="Timeless Elegance Feature" class="hero-image" onerror="this.src='https://placeholder.com'">
        </div>
    </section>

</body>
</html>
