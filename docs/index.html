<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova - Shop Smart. Live Better.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Global Navigation Header -->
    <header class="main-navbar">
        <div class="nav-logo">
            <img src="images/shopnova-logo.png" alt="ShopNova Logo" class="mini-logo">
        </div>
        <div class="search-bar-container">
            <input type="text" placeholder="Search products..." class="search-input">
            <button class="search-btn">🔍</button>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html" class="cart-link">Cart <span class="cart-count">0</span></a>
            <a href="checkout.html">Checkout</a>
            <a href="contact.html" class="btn-contact">Contact</a>
        </nav>
    </header>

    <!-- Hero Showcase Section -->
    <main class="hero-section">
        <div class="hero-left-content">
            <span class="welcome-badge">✨ Welcome to ShopNova</span>
            <h1 class="hero-main-heading">Shop Smart.<br><span class="blue-text">Live Better.</span></h1>
            <p class="hero-subtext">Discover premium products, modern style and everyday essentials all in one beautiful shopping experience.</p>
            <div class="hero-cta-buttons">
                <a href="products.html" class="btn-primary">Start Shopping →</a>
                <a href="cart.html" class="btn-secondary">View Cart 🛒</a>
            </div>
        </div>
        <div class="hero-right-graphic">
            <div class="graphic-card-frame">
                <!-- Controlled Main Brand Logo Display with Floating Motion -->
                <img src="images/shopnova-logo.png" alt="ShopNova Banner Image" class="hero-logo-img animated-dove">
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
