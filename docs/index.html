<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere Marketplace</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #333; color: white; border-radius: 5px; }
    .search-box { padding: 8px; width: 300px; border-radius: 4px; border: 1px solid #ccc; }
    .admin-btn { background: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card img { max-width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
    .price { font-size: 18px; color: #28a745; font-weight: bold; margin: 10px 0; }
    .btn-container { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .contact-wa { background: #25d366; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; }
    .contact-mail { background: #dc3545; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; }
    
    /* Simple Modal Styling for Seller Posting Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 400px; display: flex; flex-direction: column; gap: 10px; }
    .modal-content input, .modal-content textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .close-btn { background: #6c757d; color: white; padding: 8px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>ShopSphere</h1>
    <!-- Live Search Bar Feature -->
    <input type="text" id="searchBar" class="search-box" placeholder="Search products or categories...">
    <button class="admin-btn" onclick="toggleModal(true)">+ Sell Product</button>
  </header>

  <!-- Products Showcase Grid Layout -->
  <div id="productGrid" class="grid"></div>

  <!-- Seller Multi-Vendor Admin Upload Modal -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <h3>List Your Product For Sale</h3>
      <input type="text" id="pName" placeholder="Product Name" required>
      <input type="number" id="pPrice" placeholder="Price (INR)" required>
      <input type="text" id="pImage" placeholder="Image URL (Unsplash/Imgur link)">
      <input type="text" id="pCategory" placeholder="Category (e.g. Electronics)">
      <textarea id="pDesc" placeholder="Brief Description"></textarea>
      <hr>
      <h4>Your Contact Info (For Buyers)</h4>
      <input type="text" id="sName" placeholder="Your Name" required>
      <input type="email" id="sEmail" placeholder="Your Email Address" required>
      <input type="text" id="sPhone" placeholder="WhatsApp Number (With Country Code e.g. 919876543210)" required>
      
      <button class="admin-btn" onclick="submitProduct()">Submit Product Live</button>
      <button class="close-btn" onclick="toggleModal(false)">Cancel</button>
    </div>
  </div>

  <script>
    // Replace with your active live Vercel URL once deployed (e.g., 'https://vercel.app')
    const API_BASE_URL = 'http://localhost:5000/api'; 

    // Open/Close Modal
    function toggleModal(show) {
      document.getElementById('uploadModal').style.display = show ? 'flex' : 'none';
    }

    // Fetch and display active marketplace inventory
    async function loadProducts(searchQuery = '') {
      const url = searchQuery 
        ? `${API_BASE_URL}/search?q=${searchQuery}`
        : `${API_BASE_URL}/products`;

      try {
        const response = await fetch(url);
        const products = await response.json();
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        if(products.length === 0) {
          grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#666;">No products found matches your criteria.</p>`;
          return;
        }

        products.forEach(product => {
          // URLs generated cleanly to map parameters dynamically 
          const waMessage = encodeURIComponent(`Hi ${product.sellerName}, I am interested in buying your item: "${product.name}" listed on ShopSphere for ₹${product.price}. Is it still available?`);
          const waLink = `https://wa.me{product.sellerPhone}?text=${waMessage}`;
          
          const emailSubject = encodeURIComponent(`Inquiry regarding ${product.name} on ShopSphere`);
          const emailBody = encodeURIComponent(`Hello ${product.sellerName},\n\nI saw your product "${product.name}" and would like to find out more details.\n\nRegards,\nInterested Buyer`);
          const mailLink = `mailto:${product.sellerEmail}?subject=${emailSubject}&body=${emailBody}`;

          grid.innerHTML += `
            <div class="card">
              <img src="${product.image || 'https://placeholder.com'}" alt="${product.name}">
              <h3>${product.name}</h3>
              <p style="color:#666; font-size:14px;">${product.description || 'No description provided.'}</p>
              <div class="price">₹${product.price}</div>
              <p style="font-size:12px; color:#888;">Seller: ${product.sellerName}</p>
              <div class="btn-container">
                <a href="${waLink}" target="_blank" class="contact-wa">WhatsApp Seller</a>
                <a href="${mailLink}" class="contact-mail">Email Seller</a>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error('Error fetching data:', err);
      }
    }

    // Capture user typing actions inside search input box
    document.getElementById('searchBar').addEventListener('input', (e) => {
      loadProducts(e.target.value);
    });

    // Submit new vendor product straight up into the cloud database
    async function submitProduct() {
      const productData = {
        name: document.getElementById('pName').value,
        price: document.getElementById('pPrice').value,
        image: document.getElementById('pImage').value,
        category: document.getElementById('pCategory').value,
        description: document.getElementById('pDesc').value,
        sellerName: document.getElementById('sName').value,
        sellerEmail: document.getElementById('sEmail').value,
        sellerPhone: document.getElementById('sPhone').value
      };

      if(!productData.name || !productData.price || !productData.sellerPhone) {
        alert('Please fill out product name, price and valid mobile details.');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/products`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(productData)
        });
        const result = await response.json();
        if(result.success) {
          alert('Success! Your product is live for buyers.');
          toggleModal(false);
          loadProducts(); // Refresh listings grid
        }
      } catch (err) {
        alert('Error publishing item.');
        console.error(err);
      }
    }

    // Initial page initialization run
    loadProducts();
  </script>
</body>
</html>
