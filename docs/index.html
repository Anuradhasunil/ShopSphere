<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova - Shop Smart. Live Better.</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           CONTACT BUTTON ONLY
           Everything else remains unchanged
        ===================================================== */

        .main-navbar .nav-links .btn-contact {
            background: linear-gradient(
                135deg,
                #ec4899,
                #db2777
            ) !important;

            color: #ffffff !important;

            border: 1px solid rgba(255,255,255,0.35);

            box-shadow:
                0 5px 15px rgba(219,39,119,0.28);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .main-navbar .nav-links .btn-contact:hover {
            background: linear-gradient(
                135deg,
                #f472b6,
                #be185d
            ) !important;

            color: #ffffff !important;

            transform: translateY(-2px);

            box-shadow:
                0 8px 22px rgba(219,39,119,0.40);
        }

        /* Mobile */
        @media (max-width: 700px) {

            .main-navbar .nav-links .btn-contact {
                background: linear-gradient(
                    135deg,
                    #ec4899,
                    #db2777
                ) !important;

                color: #ffffff !important;
            }

        }
    </style>

</head>

<body>


    <!-- =====================================================
         SHOPNOVA HEADER
    ===================================================== -->

    <header class="main-navbar">

        <!-- EXISTING SHOPNOVA LOGO - UNCHANGED -->

        <div class="nav-logo">

            <a href="index.html">

                <img
                    src="images/shopnova-logo.png"
                    alt="ShopNova Logo"
                    class="mini-logo"
                >

            </a>

        </div>


        <!-- EXISTING SEARCH - UNCHANGED -->

        <div class="search-bar-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                class="search-input"
                autocomplete="off"
            >

            <button
                type="button"
                id="searchBtn"
                class="search-btn"
                aria-label="Search products"
            >
                🔍
            </button>

        </div>


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav class="nav-links">

            <a
                href="index.html"
                class="active"
            >
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a
                href="cart.html"
                class="cart-link"
            >
                Cart
                <span class="cart-count">0</span>
            </a>

            <a href="checkout.html">
                Checkout
            </a>


            <!--
                SINGLE CONTACT BUTTON

                This still opens your contact.html.
                Your existing contact page can contain
                WhatsApp, Instagram, YouTube, Facebook, etc.
            -->

            <a
                href="contact.html"
                class="btn-contact"
            >
                Contact
            </a>

        </nav>

    </header>



    <!-- =====================================================
         HOMEPAGE HERO
         UNCHANGED
    ===================================================== -->

    <main class="hero-section">


        <!-- LEFT CONTENT -->

        <div class="hero-left-content">

            <span class="welcome-badge animated-welcome">
                ✨ Welcome to ShopNova
            </span>


            <h1 class="hero-main-heading animated-heading">

                Shop Smart.<br>

                <span class="blue-text">
                    Live Better.
                </span>

            </h1>


            <p class="hero-subtext">

                Discover premium products, modern style and
                everyday essentials all in one beautiful
                shopping experience.

            </p>


            <div class="hero-cta-buttons">

                <a
                    href="products.html"
                    class="btn-primary"
                >
                    Start Shopping →
                </a>

                <a
                    href="cart.html"
                    class="btn-secondary"
                >
                    View Cart 🛒
                </a>

            </div>

        </div>



        <!-- =================================================
             CENTER DOVE LOGO
             COMPLETELY UNCHANGED
        ================================================== -->

        <div class="hero-right-graphic">

            <div class="graphic-card-frame">

                <img
                    src="images/shopnova-logo.png"
                    alt="ShopNova Logo"
                    class="hero-logo-img animated-dove"
                >

            </div>

        </div>

    </main>



    <!-- =====================================================
         EXISTING JAVASCRIPT
         UNCHANGED
    ===================================================== -->

    <script src="script.js"></script>

</body>
</html>
