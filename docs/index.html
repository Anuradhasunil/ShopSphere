<!-- ===== SHOPNOVA HERO LOGO ===== -->
<div class="hero-visual">

    <div class="hero-glow glow-one"></div>
    <div class="hero-glow glow-two"></div>
    <div class="hero-glow glow-three"></div>

    <div class="logo-card">

        <img
            src="./images/shopnova-logo.png"
            alt="ShopNova Dove Logo"
            class="shopnova-main-logo"

        <div id="logoFallback" class="logo-fallback">
            <div class="fallback-dove">🕊️</div>
            <div class="fallback-name">
                <span>Shop</span><strong>Nova</strong>
            </div>
            <p>Shop Smart • Live Better</p>
        </div>

    </div>

</div>
