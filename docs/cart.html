<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova | Your Cart</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; }
    .container { max-width: 800px; margin: 50px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
    h2 { color: #002d62; }
    .empty-msg { color: #666; margin: 30px 0; font-size: 16px; }
    .shop-btn { background: #ff8c00; color: white; padding: 12px 25px; text-decoration: none; border-radius: 20px; font-weight: bold; display: inline-block; }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="container">
    <h2>Your Shopping Cart 🛒</h2>
    <p class="empty-msg">Your shopping bag is currently empty. Explore products to add items here!</p>
    <a href="/products.html" class="shop-btn">Continue Shopping</a>
  </div>

  <script>
    fetch('/navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      });
  </script>
</body>
</html>
