<script>

"use strict";

const CART_KEY = "shopnova_cart";


/* =========================
   GET CART
========================= */

function getCart() {

    try {

        const saved =
            localStorage.getItem(CART_KEY);

        if (!saved) {
            return [];
        }

        const cart =
            JSON.parse(saved);

        return Array.isArray(cart)
            ? cart
            : [];

    } catch (error) {

        console.error(
            "Cart error:",
            error
        );

        return [];
    }
}


/* =========================
   SAVE CART
========================= */

function saveCart(cart) {

    localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
    );

}


/* =========================
   MONEY
========================= */

function money(value) {

    return "₹" +
        Number(value || 0)
            .toLocaleString("en-IN");
}


/* =========================
   HEADER COUNT
========================= */

function updateHeaderCount(cart) {

    const total =
        cart.reduce(
            function (sum, item) {

                return sum +
                    Math.max(
                        0,
                        Number(item.quantity) || 0
                    );

            },
            0
        );


    const count =
        document.getElementById(
            "cartCount"
        );


    if (count) {

        count.textContent =
            total;

    }
}


/* =========================
   RENDER CART
========================= */

function renderCart() {

    const cart =
        getCart();


    const cartContent =
        document.getElementById(
            "cartContent"
        );

    const emptyCart =
        document.getElementById(
            "emptyCart"
        );

    const cartItems =
        document.getElementById(
            "cartItems"
        );


    updateHeaderCount(cart);


    if (!cartContent || !emptyCart) {
        return;
    }


    if (cart.length === 0) {

        cartContent.style.display =
            "none";

        emptyCart.style.display =
            "block";

        return;
    }


    cartContent.style.display =
        "grid";

    emptyCart.style.display =
        "none";


    if (!cartItems) {
        return;
    }


    cartItems.innerHTML =
        "";


    let subtotal = 0;

    let totalQuantity = 0;


    cart.forEach(
        function (item, index) {

            const quantity =
                Math.max(
                    1,
                    Number(item.quantity) || 1
                );


            const price =
                Number(item.price) || 0;


            const total =
                price * quantity;


            subtotal += total;

            totalQuantity += quantity;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "cart-item";


            const image =
                item.image ||
                "images/luxury-banner.jpg";


            const name =
                escapeHTML(
                    item.name ||
                    "ShopNova Product"
                );


            row.innerHTML = `

                <div class="cart-item-image">

                    <img
                        src="${image}"
                        alt="${name}"
                        onerror="
                            this.onerror=null;
                            this.src='images/luxury-banner.jpg';
                        "
                    >

                </div>


                <div class="cart-item-info">

                    <h3>
                        ${name}
                    </h3>

                    <p>
                        ShopNova Premium Collection
                    </p>

                </div>


                <div class="cart-item-price">

                    ${money(price)}

                </div>


                <div class="quantity-control">

                    <button
                        type="button"
                        onclick="changeQuantity(${index}, -1)"
                    >
                        −
                    </button>

                    <span>
                        ${quantity}
                    </span>

                    <button
                        type="button"
                        onclick="changeQuantity(${index}, 1)"
                    >
                        +
                    </button>

                </div>


                <div class="item-total">

                    ${money(total)}

                </div>


                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeItem(${index})"
                    title="Remove"
                >
                    ×
                </button>

            `;


            cartItems.appendChild(row);

        }
    );


    const discount =
        subtotal >= 5000
            ? 500
            : subtotal >= 2500
                ? 250
                : 0;


    const grandTotal =
        Math.max(
            0,
            subtotal - discount
        );


    const itemsLabel =
        document.getElementById(
            "itemsLabel"
        );

    const summaryItems =
        document.getElementById(
            "summaryItems"
        );

    const subtotalElement =
        document.getElementById(
            "subtotal"
        );

    const discountElement =
        document.getElementById(
            "discount"
        );

    const grandTotalElement =
        document.getElementById(
            "grandTotal"
        );


    if (itemsLabel) {

        itemsLabel.textContent =
            totalQuantity +
            (
                totalQuantity === 1
                    ? " Item"
                    : " Items"
            );

    }


    if (summaryItems) {

        summaryItems.textContent =
            totalQuantity;

    }


    if (subtotalElement) {

        subtotalElement.textContent =
            money(subtotal);

    }


    if (discountElement) {

        discountElement.textContent =
            "-" + money(discount);

    }


    if (grandTotalElement) {

        grandTotalElement.textContent =
            money(grandTotal);

    }

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(index, amount) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }


    let quantity =
        Number(
            cart[index].quantity
        ) || 1;


    quantity += amount;


    if (quantity <= 0) {

        removeItem(index);

        return;
    }


    cart[index].quantity =
        quantity;


    saveCart(cart);

    renderCart();
}


/* =========================
   REMOVE
========================= */

function removeItem(index) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }


    const name =
        cart[index].name ||
        "Product";


    cart.splice(
        index,
        1
    );


    saveCart(cart);

    renderCart();


    showMessage(
        name +
        " removed from cart."
    );
}


/* =========================
   CLEAR CART
========================= */

function clearCart() {

    const cart =
        getCart();


    if (cart.length === 0) {

        showMessage(
            "Your cart is already empty."
        );

        return;
    }


    const confirmed =
        confirm(
            "Remove all products from your cart?"
        );


    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        CART_KEY
    );


    renderCart();


    showMessage(
        "Your cart has been cleared."
    );
}


/* =========================
   CHECKOUT
========================= */

function proceedToCheckout() {

    const cart =
        getCart();


    if (cart.length === 0) {

        showMessage(
            "Your cart is empty."
        );

        return;
    }


    window.location.href =
        "checkout.html";
}


/* =========================
   SEARCH
========================= */

function setupSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const button =
        document.getElementById(
            "searchBtn"
        );


    if (!input) {
        return;
    }


    function search() {

        const query =
            input.value.trim();


        if (query === "") {

            window.location.href =
                "products.html";

            return;
        }


        window.location.href =
            "products.html?search=" +
            encodeURIComponent(query);
    }


    if (button) {

        button.addEventListener(
            "click",
            search
        );

    }


    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                search();

            }

        }
    );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return String(text || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   MESSAGE
========================= */

function showMessage(message) {

    let box =
        document.getElementById(
            "shopnovaMessage"
        );


    if (!box) {

        box =
            document.createElement(
                "div"
            );


        box.id =
            "shopnovaMessage";


        box.style.position =
            "fixed";

        box.style.right =
            "20px";

        box.style.bottom =
            "20px";

        box.style.zIndex =
            "999999";

        box.style.background =
            "linear-gradient(135deg,#1767d8,#0875b9)";

        box.style.color =
            "white";

        box.style.padding =
            "13px 18px";

        box.style.borderRadius =
            "12px";

        box.style.fontSize =
            "13px";

        box.style.fontWeight =
            "800";

        box.style.boxShadow =
            "0 10px 30px rgba(0,0,0,.25)";

        document.body.appendChild(
            box
        );
    }


    box.textContent =
        "✓ " + message;


    box.style.opacity =
        "1";


    clearTimeout(
        window.shopnovaMessageTimer
    );


    window.shopnovaMessageTimer =
        setTimeout(
            function () {

                box.style.opacity =
                    "0";

            },
            1800
        );
}


/* =========================
   STORAGE
========================= */

window.addEventListener(
    "storage",
    function (event) {

        if (
            event.key === CART_KEY
        ) {

            renderCart();

        }

    }
);


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        renderCart();

        setupSearch();

    }
);

</script>
