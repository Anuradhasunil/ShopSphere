<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova - Your Cart</title>
    <!-- Links directly to style.css in the same directory folder -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar Section -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo">🦅 ShopNova</div>
            <div class="search-container">
                <input type="text" placeholder="Search elite collections...">
                <button class="search-btn">🔍</button>
            </div>
        </div>
        <nav class="nav-right">
            <a href="index.html" class="nav-link">Home</a>
            <a href="products.html" class="nav-link">Products</a>
            <a href="cart.html" class="nav-link active">Cart</a>
            <a href="checkout.html" class="nav-link">Checkout</a>
            <button class="connect-hub-btn">Connect Hub 🌐</button>
        </nav>
    </header>

    <!-- Main Premium Cart Layout Container -->
    <main class="cart-wrapper">
        <h1 class="cart-main-title">🛒 Your Shopping Cart</h1>
        
        <div class="cart-layout-grid">
            <!-- Left Side: Dynamic Interactive Items Container Target Hook -->
            <div class="cart-items-section">
                <!-- LEAVE THIS BLANK. Javascript will automatically build your items here -->
            </div>

            <!-- Right Side: Order Summary Checkout Sidebar -->
            <div class="cart-summary-sidebar">
                <h2 class="summary-title">Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping Charges</span>
                    <span class="text-free">FREE</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-row total-row">
                    <span>Total Amount</span>
                    <span id="cart-total" class="total-price">₹0</span>
                </div>
                
                <div class="cart-action-buttons">
                    <a href="checkout.html" class="btn-checkout">Proceed to Checkout →</a>
                    <a href="products.html" class="btn-continue">← Continue Shopping</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Copyright Branding Section -->
    <footer class="cart-footer">
        <p>© 2026 ShopNova • Executive Board Directives • CEO & Founder: Anuradha</p>
    </footer>

    <!-- VERY IMPORTANT: Make sure script.js is loaded at the bottom of the body tag -->
    <script src="script.js"></script>
</body>
</html>
