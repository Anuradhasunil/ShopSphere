
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova Cart</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f3f4f6;
      padding:40px;
    }

    h1{
      color:#081b38;
    }

    .item{
      background:white;
      padding:20px;
      margin-bottom:15px;
      border-radius:10px;
    }
  </style>
</head>
<body>

<h1>🛒 Your Cart</h1>

<div id="cartItems"></div>

<script>
  const cart = JSON.parse(localStorage.getItem('shopnova_cart')) || [];

  const container = document.getElementById('cartItems');

  if(cart.length === 0){
    container.innerHTML = '<p>Your cart is empty.</p>';
  } else {

    cart.forEach(item => {
      container.innerHTML += `
        <div class="item">
          <h3>${item.name}</h3>
          <p>₹${item.price}</p>
        </div>
      `;
    });
  }
</script>

</body>
</html>
