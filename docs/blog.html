<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova | Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #f8f5ff, #fff7fb);
            color: #172033;
            min-height: 100vh;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: linear-gradient(135deg, #061738, #172c69, #542b82);
            color: white;
            box-shadow: 0 5px 22px rgba(17, 24, 74, .18);
        }

        .header-main {
            width: 100%;
            max-width: 1450px;
            margin: auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* SHOPNOVA HEADER LOGO */
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-image {
            height: 48px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        /* HEADER NAVIGATION */
        .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-actions a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 11px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .header-actions a:hover {
            background: rgba(255, 255, 255, .1);
        }

        .blog-link {
            background: linear-gradient(135deg, #6366f1, #a855f7);
        }

        /* =========================================================
           BLOG HERO
        ========================================================= */
        .blog-hero {
            background: linear-gradient(135deg, #071a3d, #263d8a, #7137a6);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .blog-badge {
            display: inline-block;
            padding: 7px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, .13);
            border: 1px solid rgba(255, 255, 255, .2);
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .blog-hero h1 {
            font-size: clamp(34px, 6vw, 54px);
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .blog-hero p {
            max-width: 700px;
            margin: auto;
            color: #e0e7ff;
            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================================================
           BLOG WRAPPER
        ========================================================= */
        .blog-wrapper {
            width: 100%;
            max-width: 1250px;
            margin: auto;
            padding: 35px 18px 55px;
        }

        /* =========================================================
           SEARCH
        ========================================================= */
        .search-box {
            max-width: 650px;
            margin: 0 auto 35px;
            display: flex;
            background: white;
            border: 1px solid #e0e4f0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(34, 42, 88, .08);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px 17px;
            font-size: 14px;
            color: #172033;
        }

        .search-box button {
            border: none;
            padding: 0 24px;
            color: white;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        /* =========================================================
           BLOG GRID
        ========================================================= */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 23px;
        }

        /* =========================================================
           BLOG CARD
        ========================================================= */
        .blog-card {
            background: white;
            border: 1px solid #e4e7f2;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(34, 42, 88, .08);
            transition: .25s;
        }

        .blog-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(34, 42, 88, .14);
        }

        /* =========================================================
           BLOG IMAGE
        ========================================================= */
        .blog-image {
            width: 100%;
            height: 205px;
            overflow: hidden;
            background: #eef1f8;
        }

        .blog-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .3s;
        }

        .blog-card:hover .blog-image img {
            transform: scale(1.05);
        }

        /* =========================================================
           BLOG CONTENT
        ========================================================= */
        .blog-content {
            padding: 20px;
        }

        .blog-category {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .blog-content h2 {
            color: #101b45;
            font-size: 19px;
            line-height: 1.35;
            margin-bottom: 9px;
        }

        .blog-content p {
            color: #687188;
            font-size: 12px;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .read-more {
            display: inline-block;
            text-decoration: none;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 900;
        }

        .read-more:hover {
            color: #7c3aed;
        }

        /* =========================================================
           NO RESULTS
        ========================================================= */
        .no-results {
            display: none;
            text-align: center;
            background: white;
            border-radius: 16px;
            padding: 35px;
            color: #737b90;
            margin-top: 20px;
        }

        .no-results h2 {
            color: #101b45;
            margin-bottom: 8px;
        }

        /* =========================================================
           BLOG INFO
        ========================================================= */
        .blog-info {
            margin-top: 35px;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(135deg, #071a3d, #263d8a, #7137a6);
            color: white;
            text-align: center;
        }

        .blog-info h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .blog-info p {
            color: #dbe4ff;
            font-size: 13px;
            line-height: 1.7;
            max-width: 750px;
            margin: auto;
        }

        /* =========================================================
           FOOTER
        ========================================================= */
        footer {
            background: #071a3d;
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin-top: 40px;
        }

        footer h3 {
            font-size: 20px;
            font-weight: 900;
        }

        footer p {
            color: #cbd5e1;
            font-size: 11px;
            margin-top: 6px;
        }

        /* =========================================================
           RESPONSIVE MEDIA QUERIES
        ========================================================= */
        @media (max-width: 950px) {
            .blog-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .header-main {
                flex-direction: column;
                gap: 12px;
                padding: 12px;
            }

            .logo-link {
                width: 100%;
                justify-content: center;
            }

            .header-actions {
                margin-left: 0;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER NAVIGATION -->
    <header>
        <div class="header-main">
            <!-- This logo link is working perfectly now! -->
            <a href="index.html" class="logo-link">
