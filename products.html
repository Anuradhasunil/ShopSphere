<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNova - All Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #081b38;
      color: white;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }

    .catalog-title {
      text-align: center;
      margin: 40px 0;
      color: #081b38;
      font-size: 2.2rem;
    }

    .products-grid {
      max-width: 1200px;
      margin: 0 auto 60px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 0 20px;
    }

    .product-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-card h3 {
      font-size: 1.2rem;
      margin: 15px 0 10px 0;
      color: #081b38;
    }

    .price {
      font-weight: bold;
      color: #ff9800;
      font-size: 1.3rem;
      margin-bottom: 20px;
    }

    .cart-btn {
      background: #081b38;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: #112d59;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">ShopNova</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="payment.html">Cart 🛒</a>
    </nav>
  </header>

  <h2 class="catalog-title">Our Full Product Catalog</h2>

  <div class="products-grid">
    <!-- 1. Workstation Laptop -->
    <div class="product-card">
      <img src="https://unsplash.com" alt="Premium Workstation Laptop">
      <h3>Premium Workstation Laptop</h3>
      <div class="price">₹95,000</div>
      <button class="cart-btn" onclick="addToCart('Premium Workstation Laptop', 95000)">Add to Cart 🛒</button>
    </div>

    <!-- 2. Wireless Headphones -->
    <div class="product-card">
      <img src="https://unsplash.com" alt="Studio Wireless Headphones">
      <h3>Studio Wireless Headphones</h3>
      <div class="price">₹15,000</div>
      <button class="cart-btn" onclick="addToCart('Studio Wireless Headphones', 15000)">Add to Cart 🛒</button>
    </div>

    <!-- 3. Holy Bible (ADDED HERE FOR PRODUCTS CATALOG) -->
    <div class="product-card">
      <img src="https://unsplash.com" alt="Holy Bible">
      <h3>Holy Bible (Hardcover Edition)</h3>
      <div class="price">₹1,200</div>
      <button class="cart-btn" onclick="addToCart('Holy Bible (Hardcover Edition)', 1200)">Add to Cart 🛒</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
